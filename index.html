<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的中文小课堂</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            "Microsoft YaHei",
            "PingFang SC",
            "Noto Sans SC",
            Arial,
            sans-serif;

        background:
            linear-gradient(180deg, #f7fbff 0%, #fffaf5 100%);

        color: #334155;
        min-height: 100vh;
    }

    /* =========================
       顶部
    ========================= */

    header {
        text-align: center;
        padding: 55px 20px 35px;
    }

    .logo {
        font-size: 48px;
        margin-bottom: 12px;
    }

    h1 {
        font-size: 38px;
        color: #334155;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }

    .subtitle {
        font-size: 17px;
        color: #64748b;
    }

    /* =========================
       主内容
    ========================= */

    main {
        max-width: 1050px;
        margin: 0 auto;
        padding: 10px 20px 70px;
    }

    .welcome {
        text-align: center;
        margin-bottom: 35px;
        font-size: 16px;
        color: #64748b;
    }

    /* =========================
       两个主要分类
    ========================= */

    .category-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        margin-bottom: 45px;
    }

    .category {
        background: white;
        border-radius: 25px;
        padding: 35px 30px;
        text-align: center;

        box-shadow:
            0 8px 25px rgba(100, 116, 139, 0.10);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;
    }

    .category:hover {
        transform: translateY(-6px);

        box-shadow:
            0 15px 35px rgba(100, 116, 139, 0.16);
    }

    .category-icon {
        font-size: 58px;
        margin-bottom: 15px;
    }

    .category h2 {
        font-size: 26px;
        margin-bottom: 10px;
        color: #334155;
    }

    .category p {
        font-size: 15px;
        color: #64748b;
        line-height: 1.8;
        margin-bottom: 22px;
    }

    .button {
        display: inline-block;
        text-decoration: none;

        padding: 11px 25px;

        border-radius: 30px;

        font-size: 15px;
        font-weight: 600;

        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }

    .button:hover {
        transform: scale(1.04);
        opacity: 0.88;
    }

    .grammar-button {
        background: #dbeafe;
        color: #2563eb;
    }

    .text-button {
        background: #fce7f3;
        color: #db2777;
    }

    /* =========================
       最近学习
    ========================= */

    .section-title {
        text-align: center;
        font-size: 25px;
        margin-bottom: 22px;
        color: #334155;
    }

    .section-title span {
        margin-right: 8px;
    }

    .recent-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
    }

    .recent-card {
        background: white;
        border-radius: 18px;
        padding: 22px;

        text-decoration: none;
        color: inherit;

        box-shadow:
            0 5px 18px rgba(100, 116, 139, 0.08);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .recent-card:hover {
        transform: translateY(-4px);

        box-shadow:
            0 10px 25px rgba(100, 116, 139, 0.13);
    }

    .recent-icon {
        font-size: 30px;
        margin-bottom: 10px;
    }

    .recent-card h3 {
        font-size: 17px;
        margin-bottom: 7px;
        color: #334155;
    }

    .recent-card p {
        font-size: 13px;
        line-height: 1.6;
        color: #64748b;
    }

    .new {
        display: inline-block;
        font-size: 11px;

        background: #fef3c7;
        color: #b45309;

        padding: 3px 8px;
        border-radius: 10px;

        margin-left: 5px;
        vertical-align: middle;
    }

    /* =========================
       页脚
    ========================= */

    footer {
        text-align: center;
        padding: 30px 20px 40px;

        color: #94a3b8;
        font-size: 14px;
    }

    .footer-flower {
        font-size: 22px;
        margin-bottom: 8px;
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 700px) {

        header {
            padding-top: 40px;
        }

        .logo {
            font-size: 40px;
        }

        h1 {
            font-size: 30px;
        }

        .subtitle {
            font-size: 15px;
        }

        .category-grid {
            grid-template-columns: 1fr;
        }

        .recent-grid {
            grid-template-columns: 1fr;
        }

        .category {
            padding: 30px 22px;
        }
    }
</style>
</head>


<body>

<!-- =========================
     顶部
========================= -->

<header>

    <div class="logo">🌸</div>

    <h1>我的中文小课堂</h1>

    <p class="subtitle">
        学中文 · 读课文 · 做练习
    </p>

</header>


<main>

    <p class="welcome">
        欢迎来到中文学习小课堂！<br>
        选择你想学习的内容，开始练习吧 😊
    </p>


    <!-- =========================
         两大分类
    ========================= -->

    <div class="category-grid">


        <!-- 语法 -->

        <div class="category">

            <div class="category-icon">🧩</div>

            <h2>语法练习</h2>

            <p>
                学习中文句子的结构和语法，
                通过练习更好地理解和使用中文。
            </p>

            <a
                href="grammar/index.html"
                class="button grammar-button">
                进入语法练习 →
            </a>

        </div>


        <!-- 课文 -->

        <div class="category">

            <div class="category-icon">📖</div>

            <h2>课文学习</h2>

            <p>
                阅读有趣的中文课文，
                学习词语、句子和课文内容。
            </p>

            <a
                href="texts/index.html"
                class="button text-button">
                进入课文学习 →
            </a>

        </div>

    </div>


    <!-- =========================
         最近学习
    ========================= -->

    <h2 class="section-title">
        <span>✨</span>
        最近学习
    </h2>


    <div class="recent-grid">


        <!-- 济南的冬天 -->

        <a
            href="texts/jinan-winter.html"
            class="recent-card">

            <div class="recent-icon">❄️</div>

            <h3>
                《济南的冬天》
                <span class="new">NEW</span>
            </h3>

            <p>
                老舍笔下的济南冬天，
                一起阅读课文，学习词语和句子。
            </p>

        </a>


        <!-- 时间和地点 -->

        <a
            href="grammar/time-location.html"
            class="recent-card">

            <div class="recent-icon">📍</div>

            <h3>
                时间和地点
                <span class="new">NEW</span>
            </h3>

            <p>
                学习中文句子中时间和地点
                的常见表达方式。
            </p>

        </a>

    </div>

</main>


<!-- =========================
     页脚
========================= -->

<footer>

    <div class="footer-flower">🌱</div>

    <p>学一点，练一点，慢慢进步。</p>

</footer>


</body>
</html>
