<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>李清照 · 四首诗词朗诵</title>
<style>
:root{--ink:#303a36;--green:#3d695e;--light:#f8f5ef;--line:#d9d6cc}*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:var(--ink);font-family:"Noto Serif CJK SC","Songti SC","SimSun",serif}button{font:inherit;cursor:pointer}header{background:linear-gradient(90deg,rgba(250,247,241,.93),rgba(250,247,241,.76)),url('assets/cover.png') center/cover;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px 16px;border-bottom:1px solid #dedbd3}header h1{font-size:clamp(32px,5vw,50px);letter-spacing:.17em;font-weight:500;margin:0 0 10px}header p{margin:0;font-size:15px;color:#66716c;letter-spacing:.15em}.shell{max-width:1100px;margin:25px auto;padding:0 20px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.tab{border:1px solid #d9ddd4;background:#fffdfa;border-radius:13px;padding:15px 9px;color:#52635a;min-height:76px;transition:.2s}.tab strong{display:block;font-size:16px;margin-bottom:5px}.tab small{font-size:12px}.tab[aria-selected="true"]{background:#416a60;color:white;border-color:#416a60;box-shadow:0 6px 20px #345c4a23}.panel{position:relative;border:1px solid #e3dfd5;border-radius:18px;overflow:hidden;background:#fff;min-height:540px;box-shadow:0 10px 36px #383c3220}.panel:before{content:"";position:absolute;inset:0;background-image:var(--bg);background-position:center;background-size:cover;opacity:.48}.inner{position:relative;padding:34px clamp(16px,5vw,60px) 32px;min-height:540px;background:linear-gradient(90deg,rgba(255,255,255,.84),rgba(255,255,255,.62));display:flex;flex-direction:column;align-items:center}.eyebrow{font-size:13px;letter-spacing:.2em;color:#657c71}.poem-title{font-size:clamp(25px,4vw,37px);font-weight:500;text-align:center;margin:14px 0 6px}.author{font-size:16px;color:#6e736b;margin:0 0 26px}.verses{font-size:clamp(20px,2.7vw,27px);line-height:2.15;letter-spacing:.045em;text-align:center;max-width:850px;min-height:210px;transition:opacity .15s}.verses p{margin:0 0 14px}.verses ruby{ruby-position:over;ruby-align:center;white-space:nowrap}.verses rt{font-family:Arial,"Noto Sans",sans-serif;font-size:.53em;letter-spacing:0;color:#426b5d;font-weight:400;line-height:1.3}.verses.no-pinyin rt{display:none}.verses.no-pinyin ruby{ruby-position:over}.verses{padding-top:10px}.verses.hidden{filter:blur(13px);user-select:none;pointer-events:none}.controls{width:min(660px,100%);margin-top:auto;padding:17px 20px;background:rgba(255,255,255,.92);border:1px solid #e4e6df;border-radius:15px;box-shadow:0 6px 24px #2f483515}.controls .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}.controls .head span{color:#65766e}.controls audio{width:100%;height:42px;display:block}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px 0 0}.action{border:1px solid #b8cbc2;background:#fffdf8;color:#365e52;padding:10px 16px;border-radius:999px;font-size:14px}.action:hover{background:#eaf1ec}.hint{text-align:center;font-size:13px;color:#788078;margin:16px 0 32px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.nav button{background:#fff;border:1px solid #d4dcd5;border-radius:12px;padding:11px 18px;color:#3c6558}.nav button:disabled{opacity:.35;cursor:default}@media(max-width:680px){header{min-height:135px}.shell{padding:0 12px;margin:15px auto}.tabs{grid-template-columns:repeat(2,1fr);gap:8px}.tab{min-height:63px;padding:10px 5px}.tab strong{font-size:14px}.inner{min-height:540px;padding:24px 12px}.verses{font-size:19px;line-height:2;min-height:230px}.controls{padding:12px}.poem-title{font-size:26px}.nav button{padding:10px 12px;font-size:14px}}

.practice{margin-top:20px;border:1px solid #e0dfd6;background:#fffefa;border-radius:18px;padding:24px clamp(15px,4vw,36px);box-shadow:0 5px 20px #383c3210}.practice h2{font-size:24px;font-weight:500;margin:0 0 8px}.practice .intro{color:#68766e;font-size:14px;margin:0 0 18px;line-height:1.8}.practice-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}.practice-toolbar button,.quiz-actions button{border:1px solid #b9c9c0;border-radius:10px;padding:9px 15px;background:#f5faf6;color:#315c50}.practice-toolbar button[aria-pressed="true"]{background:#416a60;color:#fff}.quiz{display:grid;gap:16px}.quiz-item{padding:16px 18px;border:1px solid #e5e7df;background:#fff;border-radius:12px}.quiz-item .number{font-size:12px;color:#738276;margin-bottom:8px}.quiz-line{font-size:clamp(17px,2.3vw,23px);line-height:2.2;letter-spacing:.03em}.blank{display:inline-flex;vertical-align:middle;min-width:5em;justify-content:center;align-items:center;border-bottom:2px solid #88a99a;background:#f0f5f0;border-radius:5px 5px 0 0;min-height:1.8em;padding:0 7px;color:#3c6959}.blank input{width:6em;max-width:25vw;font:inherit;text-align:center;color:#31594c;background:transparent;border:0;outline-offset:3px}.blank.wide input{width:8em}.blank .placeholder{color:#829b8e;font-size:.8em}.blank input::placeholder{color:#8ca79a;opacity:1;letter-spacing:.12em}.quiz-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.quiz-actions button{font-size:13px;padding:6px 12px}.feedback{font-size:14px;color:#537163}.feedback.ok{color:#247044}.feedback.retry{color:#a36837}.quiz-footer{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.quiz-footer button{border-radius:999px;border:1px solid #b9c9c0;background:#fff;padding:10px 17px;color:#365e52}.practice-note{color:#748078;font-size:13px;margin-top:12px}@media(max-width:680px){.practice{padding:18px 12px}.quiz-item{padding:12px}.quiz-line{font-size:18px}}
</style></head><body>
<header><div><h1>李清照 · 诗词雅韵</h1><p>四首经典诗词 · 原版朗诵 · 跟读练习</p></div></header>
<main class="shell"><p style="margin:0 0 16px"><a href="../index.html" style="color:#3d695e;text-decoration:none;font-size:15px">← 返回课文学习</a></p><nav class="tabs" aria-label="选择诗词" id="tabs"></nav><section class="panel" id="panel"><div class="inner"><div class="eyebrow" id="counter"></div><h2 class="poem-title" id="title"></h2><p class="author">〔宋〕李清照</p><div class="verses" id="verses"></div><div class="controls"><div class="head"><strong>♫ 原版诗词朗诵</strong><span id="status">点击播放，聆听诗词</span></div><audio id="audio" controls preload="metadata" aria-label="诗词朗诵音频"></audio><div class="actions"><button class="action" id="replay" type="button">↺ 从头播放</button><button class="action" id="pinyinToggle" type="button" aria-pressed="true">隐藏拼音</button><button class="action" id="toggle" type="button" aria-pressed="false">隐藏原文 · 自己试读</button></div></div></div></section><section class="practice" aria-labelledby="practice-title"><h2 id="practice-title">✦ 诗词补一补</h2><p class="intro">诗句里藏起了几个词语。可以看着诗句把空缺的部分<strong>读出来</strong>，也可以切换到<strong>动笔填写</strong>。不用背诵整首诗。填写时，每个□代表一个汉字。</p><div class="practice-toolbar"><button id="readmode" type="button" aria-pressed="true">开口读一读</button><button id="writemode" type="button" aria-pressed="false">动笔填一填</button><button id="refresh" type="button">↻ 换一组词语</button></div><div class="quiz" id="quiz"></div><div class="quiz-footer"><button id="revealall" type="button">显示全部答案</button><button id="resetquiz" type="button">重新练习</button></div><p class="practice-note">提示：可以先听上面的原版朗诵，再完成诗词补空练习。点击“显示答案”可以自行核对。</p></section><div class="nav"><button id="prev" type="button">← 上一首</button><button id="next" type="button">下一首 →</button></div><p class="hint">小建议：先听一遍朗诵，再跟着朗读，最后隐藏原文试一试。</p></main>
<script>
const poems=[
{title:'如梦令 · 常记溪亭日暮',short:'常记溪亭日暮',sub:'湖上游兴',audio:'assets/recitation1.mp3',bg:'assets/poem1.jpg',lines:['常记溪亭日暮，沉醉不知归路。','兴尽晚回舟，误入藕花深处。','争渡，争渡，惊起一滩鸥鹭。']},
{title:'如梦令 · 昨夜雨疏风骤',short:'昨夜雨疏风骤',sub:'惜春海棠',audio:'assets/recitation2.m4a',bg:'assets/poem2.jpg',lines:['昨夜雨疏风骤，浓睡不消残酒。','试问卷帘人，却道海棠依旧。','知否，知否？应是绿肥红瘦。']},
{title:'一剪梅 · 红藕香残玉簟秋',short:'一剪梅',sub:'相思与离愁',audio:'assets/recitation3.mp3',bg:'assets/poem3.jpg',lines:['红藕香残玉簟秋。轻解罗裳，独上兰舟。','云中谁寄锦书来？雁字回时，月满西楼。','花自飘零水自流。一种相思，两处闲愁。','此情无计可消除，才下眉头，却上心头。']},
{title:'夏日绝句',short:'夏日绝句',sub:'英雄气概',audio:'assets/recitation4.m4a',bg:'assets/poem4.jpg',lines:['生当作人杰，死亦为鬼雄。','至今思项羽，不肯过江东。']}
];
const poemPinyin=[["cháng jì xī tíng rì mù chén zuì bù zhī guī lù", "xìng jìn wǎn huí zhōu wù rù ǒu huā shēn chù", "zhēng dù zhēng dù jīng qǐ yī tān ōu lù"], ["zuó yè yǔ shū fēng zhòu nóng shuì bù xiāo cán jiǔ", "shì wèn juǎn lián rén què dào hǎi táng yī jiù", "zhī fǒu zhī fǒu yīng shì lǜ féi hóng shòu"], ["hóng ǒu xiāng cán yù diàn qiū qīng jiě luó cháng dú shàng lán zhōu", "yún zhōng shuí jì jǐn shū lái yàn zì huí shí yuè mǎn xī lóu", "huā zì piāo líng shuǐ zì liú yī zhǒng xiāng sī liǎng chù xián chóu", "cǐ qíng wú jì kě xiāo chú cái xià méi tóu què shàng xīn tóu"], ["shēng dāng zuò rén jié sǐ yì wéi guǐ xióng", "zhì jīn sī xiàng yǔ bù kěn guò jiāng dōng"]];
const $=id=>document.getElementById(id);
const practiceSets=[
[[['沉醉','不知归路'],['晚回舟','藕花深处'],['争渡','鸥鹭']],[['溪亭日暮','沉醉'],['兴尽','误入'],['争渡','惊起']]],
[[['雨疏风骤','残酒'],['卷帘人','海棠依旧'],['知否','绿肥红瘦']],[['昨夜','浓睡'],['试问','却道'],['应是','红瘦']]],
[[['玉簟秋','兰舟'],['锦书','西楼'],['飘零','闲愁'],['眉头','心头']],[['红藕香残','轻解罗裳'],['雁字回时','月满西楼'],['一种相思','两处闲愁'],['无计可消除','才下眉头']]],
[[['人杰','鬼雄'],['项羽','江东']],[['生当','死亦'],['至今','不肯']]]
];
let practiceMode='read',practiceVersion=[0,0,0,0];
function practiceRender(){const p=poems[active], words=practiceSets[active][practiceVersion[active]],root=$('quiz');root.replaceChildren();p.lines.forEach((line,idx)=>{const item=document.createElement('div');item.className='quiz-item';const number=document.createElement('div');number.className='number';number.textContent='第 '+(idx+1)+' 句';item.append(number);const verse=document.createElement('div');verse.className='quiz-line';let remainder=line;const answers=[];for(const word of words[idx]){const pos=remainder.indexOf(word);if(pos<0)continue;verse.append(document.createTextNode(remainder.slice(0,pos)));const blank=document.createElement('span');blank.className='blank';blank.dataset.answer=word;if(practiceMode==='write'){const input=document.createElement('input');input.type='text';input.setAttribute('aria-label',`填写缺少的${word.length}个汉字`);input.placeholder='□'.repeat(word.length);input.autocomplete='off';input.spellcheck=false;input.maxLength=word.length;input.style.width=Math.max(3,word.length+0.8)+'em';blank.append(input)}else{const ph=document.createElement('span');ph.className='placeholder';ph.textContent='（读一读）';blank.append(ph)}verse.append(blank);answers.push(blank);remainder=remainder.slice(pos+word.length)}verse.append(document.createTextNode(remainder));item.append(verse);const actions=document.createElement('div');actions.className='quiz-actions';const reveal=document.createElement('button');reveal.type='button';reveal.textContent='显示答案';const feedback=document.createElement('span');feedback.className='feedback';reveal.onclick=()=>{answers.forEach(b=>b.replaceChildren(document.createTextNode(b.dataset.answer)));feedback.textContent='可以对照原句再读一遍';reveal.textContent='已显示答案'};actions.append(reveal);if(practiceMode==='write'){const check=document.createElement('button');check.type='button';check.textContent='检查填写';check.onclick=()=>{const results=answers.map(b=>{const inp=b.querySelector('input');return inp?inp.value.replace(/[\s，。！？、,.!?]/g,'')===b.dataset.answer:true});feedback.textContent=results.every(Boolean)?'✓ 全部正确！':`答对 ${results.filter(Boolean).length} / ${results.length} 个，可以再试试或查看答案`;feedback.className='feedback '+(results.every(Boolean)?'ok':'retry')};actions.prepend(check)}actions.append(feedback);item.append(actions);root.append(item)})}
function setPracticeMode(mode){practiceMode=mode;$('readmode').setAttribute('aria-pressed',String(mode==='read'));$('writemode').setAttribute('aria-pressed',String(mode==='write'));practiceRender()}
$('readmode').onclick=()=>setPracticeMode('read');$('writemode').onclick=()=>setPracticeMode('write');$('refresh').onclick=()=>{practiceVersion[active]=1-practiceVersion[active];practiceRender()};$('resetquiz').onclick=practiceRender;$('revealall').onclick=()=>document.querySelectorAll('#quiz .quiz-actions button:last-of-type').forEach(b=>{if(b.textContent==='显示答案')b.click()});
let pinyinVisible=true;
function renderPoemLine(line,syllables){const el=document.createElement('p');let n=0;for(const ch of line){if(/[\u3400-\u9fff]/.test(ch)){const ruby=document.createElement('ruby');ruby.append(document.createTextNode(ch));const rt=document.createElement('rt');rt.textContent=syllables[n++];ruby.append(rt);el.append(ruby)}else{el.append(document.createTextNode(ch))}}return el}
$('pinyinToggle').onclick=()=>{pinyinVisible=!pinyinVisible;$('verses').classList.toggle('no-pinyin',!pinyinVisible);$('pinyinToggle').textContent=pinyinVisible?'隐藏拼音':'显示拼音';$('pinyinToggle').setAttribute('aria-pressed',String(pinyinVisible))};
let active=0;const tabs=$('tabs');poems.forEach((p,i)=>{let b=document.createElement('button');b.className='tab';b.type='button';b.innerHTML='<strong>'+p.short+'</strong><small>'+p.sub+'</small>';b.addEventListener('click',()=>show(i));tabs.append(b)});
function show(i){active=i;let p=poems[i];$('audio').pause();$('audio').src=p.audio;$('audio').load();$('title').textContent=p.title;$('counter').textContent='第 '+['一','二','三','四'][i]+' 首 · 诗词朗诵';$('verses').replaceChildren(...p.lines.map((t,j)=>renderPoemLine(t,poemPinyin[i][j].split(' '))));$('verses').classList.toggle('no-pinyin',!pinyinVisible);$('panel').style.setProperty('--bg',`url("${p.bg}")`);$('verses').classList.remove('hidden');$('toggle').textContent='隐藏原文 · 自己试读';$('toggle').setAttribute('aria-pressed','false');$('status').textContent='点击播放，聆听诗词';[...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));$('prev').disabled=i===0;$('next').disabled=i===poems.length-1;practiceRender();}
$('prev').onclick=()=>show(active-1);$('next').onclick=()=>show(active+1);$('toggle').onclick=()=>{let hidden=$('verses').classList.toggle('hidden');$('toggle').textContent=hidden?'显示诗词原文':'隐藏原文 · 自己试读';$('toggle').setAttribute('aria-pressed',String(hidden))};$('replay').onclick=()=>{$('audio').currentTime=0;$('audio').play().catch(()=>{$('status').textContent='请使用音频播放器播放'})};$('audio').addEventListener('play',()=>{$('status').textContent='正在播放'});$('audio').addEventListener('pause',()=>{$('status').textContent='已暂停'});$('audio').addEventListener('ended',()=>{$('status').textContent='播放完成，可再听一遍'});$('audio').addEventListener('error',()=>{$('status').textContent='音频加载失败，请检查 assets 文件夹'});show(0);
</script></body></html>
