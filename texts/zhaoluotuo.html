/* 生字词冒险：真正的视觉反馈与动效 */
#adventure-stage{position:relative;overflow:hidden;min-height:340px;background:linear-gradient(180deg,#fbfdf7,#f2f8ec)}

.adv-balloon:nth-child(2){animation-delay:-.6s;background:#ffe9e6!important;border-color:#e8ada6!important}
.adv-balloon:nth-child(3){animation-delay:-1.2s;background:#fff0c8!important;border-color:#e7c57c!important}
.adv-balloon:nth-child(4){animation-delay:-1.8s;background:#e7f4e3!important;border-color:#9bc798!important}
@keyframes balloonFloat{0%,100%{transform:translateY(4px) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}

function speak(t) {
    let textKey = t.trim();
    
    // 1. 优先播放已经生成的 mp3（高清女声）
    if (window.TTS_AUDIO && window.TTS_AUDIO[textKey]) {
        if ('speechSynthesis' in window) speechSynthesis.cancel(); // 停掉系统音
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; } // 停掉上一个mp3
        
        // --- 智能路径拼接核心逻辑 ---
        // 找到 tts-manifest.js 当前的完整 URL
        let manifestScript = document.querySelector('script[src$="tts-manifest.js"]');
        let scriptSrc = manifestScript ? manifestScript.src : ''; 
        // 获取其所在目录，例如 https://你的域名/仓库/audio/
        let baseDir = scriptSrc.substring(0, scriptSrc.lastIndexOf('/') + 1);
        
        let audioUrl = window.TTS_AUDIO[textKey];
        // 如果 manifest 里存的不是绝对路径(http开头)，就拼上 baseDir
        if (!audioUrl.startsWith('http')) {
            // 如果 manifest 里存的是 "audio/xxx.mp3"，去掉前缀防止重复拼接
            if (audioUrl.startsWith('audio/')) audioUrl = audioUrl.replace('audio/', '');
            audioUrl = baseDir + audioUrl;
        }

        currentAudio = new Audio(audioUrl);
        currentAudio.play().catch(e => {
            console.error("播放失败，检查音频是否存在:", audioUrl, e);
            console.warn("预生成音频不可用，尝试浏览器朗读。"); fallbackSpeak(textKey);
        });
        return; // 播放成功，直接结束
    }
    
    // 2. 如果没找到 mp3，自动降级用浏览器自带的系统音
    if (!('speechSynthesis' in window)) { alert('当前浏览器不支持朗读'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(textKey);
    u.lang = 'zh-CN';
    u.rate = 0.83;
    const v = speechSynthesis.getVoices().find(x => x.lang.toLowerCase().startsWith('zh'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
}

function render(){el('nav').innerHTML=modules.map(m=>`<button data-target="${m.id}">${m.name}</button>`).join('');el('content').innerHTML=`<section class="section" id="read"><div class="panel"><h2>📖 读一读《找骆驼》</h2><p class="muted">先读课文，再完成练习。可以点击段落旁边的按钮听朗读（使用浏览器语音）。</p><div class="toolbar"><button class="btn primary" onclick="speak(story.join(''))">▶ 朗读全文</button><button class="btn" onclick="speechSynthesis.cancel()">■ 停止朗读</button></div><div class="story">${story.map((p,i)=>`<div style="display:flex;align-items:start;gap:8px"><p style="flex:1">${esc(p)}</p><button class="btn small" style="flex:none;padding:5px 9px" onclick="speak(story[${i}])">🔊</button></div>`).join('')}</div><p class="note">想一想：老人<strong>看见了什么</strong>？又<strong>推断出什么</strong>？这两者有什么不同？</p><div class="bottom"><span class="muted">课文第55—56页</span><button class="btn primary" onclick="nav('words')">开始词语练习 →</button></div></div></section><section class="section" id="words"><div class="panel"><h2>🎮 生字词游戏乐园</h2><p class="muted">先玩游戏，再看词语卡。每次题目都会打乱，答错可以再试一次。</p><div class="toolbar"><button class="btn primary" onclick="startWordGame('listen')">🔊 听音找词</button><button class="btn" onclick="startWordGame('meaning')">🧩 词义配对</button><button class="btn" onclick="startWordGame('missing')">✍️ 补全词语</button></div><div id="word-game" class="game-area"><p>选择一个游戏，开始挑战吧！</p></div></div><div class="panel"><h3>📚 词语卡片 · 自主复习</h3><p class="muted">点击词语听读音；也可以先遮住拼音自己读。</p><div class="wordgrid">${words.map(([w,p])=>`<div class="word"><b>${w}</b><span>${p}</span><br><button class="btn" onclick="speak('${w}')">🔊 听一听</button></div>`).join('')}</div></div></section><section class="section" id="adventure"><div class="panel"><h2>🐪 生字词冒险乐园</h2><p class="muted">每个游戏10题，先认读、再听辨、最后用线索帮助商人找到骆驼。不限时，做错会有提示。</p><div class="adventure-menu"><button onclick="startAdventure('balloon')">🎈<b>拼音气球</b><small>看汉字，选拼音</small></button><button onclick="startAdventure('mole')">🔨<b>听音打地鼠</b><small>听发音，找汉字</small></button><button onclick="startAdventure('memory')">🃏<b>记忆翻牌</b><small>汉字与词义配对</small></button><button onclick="startAdventure('camel')">🐪<b>寻找骆驼</b><small>词义挑战，收集线索</small></button></div><div class="toolbar"><button class="btn" onclick="startAdventure('review')">⭐ 错题再挑战</button><button class="btn" onclick="nav('words')">📚 返回词语卡片</button></div><div id="adventure-stage" class="game-area"><p class="muted">选择上面的小游戏开始吧！</p></div></div></section><section class="section" id="fill">${quiz('fill')}</section><section class="section" id="logic">${quiz('logic')}<div class="panel"><h3>🔗 线索与结论</h3><div class="note">脚印右深左浅 → 左脚有点儿跛<br>路左边有红枣、右边有豆子 → 骆驼驮着这两种东西<br>树叶上有不完整的咬痕 → 骆驼缺了一颗牙齿</div></div></section><section class="section" id="sentence"><div class="panel"><h2>📝 句子与回答问题</h2><p class="muted">根据练习册“改写句子”“用词造句”“回答问题”设计。开放题没有唯一答案，写好后可以查看参考答案，自己修改。</p>${writing.map(([q,a],i)=>`<div class="question"><div class="number">第 ${i+1} / ${writing.length} 题</div><div class="prompt">${esc(q)}</div><textarea class="answer" rows="2" id="write-${i}" placeholder="在这里写下你的答案……"></textarea><div class="toolbar"><button class="btn" onclick="checkWriting(${i})">保存并查看参考答案</button><button class="btn" onclick="speak(${JSON.stringify(q)})">🔊 听题目</button></div><div class="feedback" id="wf-${i}" style="display:none">${esc(a)}<br><span class="small">请对照检查意思、词语和语序；开放题需要自己判断。</span></div></div>`).join('')}</div></section><section class="section" id="detective">${quiz('detective')}</section><section class="section" id="result"><div class="panel" id="results"></div></section>`;document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.target)));document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b)));writing.forEach((_,i)=>{el('write-'+i).value=state['w'+i]||'';el('write-'+i).addEventListener('input',e=>{state['w'+i]=e.target.value;save()});if(state['seen'+i])el('wf-'+i).style.display='block'});['fill','logic','detective'].forEach(refresh);nav('read')}
function choose(b){let {q,i,val}=b.dataset;state[q+i]=val;save();refresh(q)}function refresh(id){qs[id].forEach((q,i)=>{const val=state[id+i],fb=el('fb-'+id+'-'+i);document.querySelectorAll(`[data-q="${id}"][data-i="${i}"]`).forEach(b=>{b.classList.remove('selected','correct','wrong');if(b.dataset.val===val){b.classList.add('selected',val===q[2]?'correct':'wrong')}});if(val){fb.style.display='block';fb.className='feedback '+(val===q[2]?'':'bad');fb.textContent=(val===q[2]?'✓ 回答正确！ ':'再想一想。正确答案：'+q[2]+'。 ')+q[3]}else fb.style.display='none'});let done=qs[id].filter((q,i)=>state[id+i]).length;el('count-'+id).textContent=`已完成 ${done} / ${qs[id].length} 题`;el('bar-'+id).style.width=100*done/qs[id].length+'%'}function resetQuiz(id){if(!confirm('确定清空本模块的答题记录吗？'))return;qs[id].forEach((q,i)=>delete state[id+i]);save();refresh(id)}function checkWriting(i){state['seen'+i]=true;save();el('wf-'+i).style.display='block'}function results(){const total=Object.values(qs).reduce((n,x)=>n+x.length,0);let done=0,correct=0;Object.keys(qs).forEach(id=>qs[id].forEach((q,i)=>{if(state[id+i]){done++;if(state[id+i]===q[2])correct++}}));const written=writing.filter((_,i)=>(state['w'+i]||'').trim()).length;el('results').innerHTML=`<h2>🏆 我的学习成果</h2><p class="muted">选择题和填空题自动计分，写作题需要自己对照参考答案。</p><div class="score">${correct} / ${total}</div><p>已答选择题 ${done} 题，答对 ${correct} 题；完成书面题 ${written} / ${writing.length} 题。</p><div class="progress"><div style="width:${100*done/total}%"></div></div><p class="note">${done===total&&correct===total?'全部答对！你已经完成了这次挑战。':'可以回到各个模块继续练习，或者重新尝试做错的题目。'}</p><div class="toolbar"><button class="btn primary" onclick="nav('logic')">继续阅读练习</button><button class="btn" onclick="window.print()">打印学习成果</button></div><p class="small muted">成绩只保存在当前设备的浏览器中，不会上传到服务器。</p>`}render();

const gameBank=[
['跛','bǒ','腿脚不方便，走路一瘸一拐'],['驮','tuó','用背背着东西'],['痕迹','hén jì','事物留下的印记'],['询问','xún wèn','向别人打听或提问'],['气愤','qì fèn','非常生气'],['心平气和','xīn píng qì hé','心情平静，态度温和'],['慢吞吞','màn tūn tūn','动作或说话很慢'],['迎面','yíng miàn','从正面向自己走来'],['详细','xiáng xì','具体而清楚'],['脚印','jiǎo yìn','脚踩过留下的印子'],['缺','quē','少了，不完整'],['循','xún','沿着、顺着'],['究竟','jiū jìng','表示追问到底'],['指点','zhǐ diǎn','指出办法或方向'],['丢失','diū shī','遗失、找不到了'],['刚才','gāng cái','不久以前'],['正好','zhèng hǎo','恰好、刚好'],['了解','liǎo jiě','知道、明白'],['物品','wù pǐn','东西'],['枣','zǎo','一种可以吃的果实']];
let wordGame=null;
function shuffleGame(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startWordGame(mode){wordGame={mode,items:shuffleGame(gameBank).slice(0,10),idx:0,score:0,locked:false};renderWordGame()}
function renderWordGame(){let g=wordGame;if(!g)return;let box=el('word-game');if(g.idx>=g.items.length){box.innerHTML=`<h3>🎉 闯关完成！</h3><p class="game-prompt">答对 ${g.score} / ${g.items.length} 题</p><p>${g.score===10?'太棒了，全部答对！':'继续加油，再玩一次会更熟练！'}</p><button class="btn primary" onclick="startWordGame('${g.mode}')">再玩一次 ↻</button>`;state['wordgame-'+g.mode]=Math.max(state['wordgame-'+g.mode]||0,g.score);save();return}
let item=g.items[g.idx], mode=g.mode, options,heading;
if(mode==='listen'){options=shuffleGame([item[0],...shuffleGame(gameBank.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[0])]);heading='听一听，选出听到的词语';}
else if(mode==='meaning'){options=shuffleGame([item[2],...shuffleGame(gameBank.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[2])]);heading=`“${item[0]}”是什么意思？`}
else{let pool=shuffleGame([...new Set(gameBank.map(x=>x[0][0]).filter(x=>x!==item[0][0]))]).slice(0,3);options=shuffleGame([item[0][0],...pool]);heading=`补上第一个字：＿${item[0].slice(1)}`}
box.innerHTML=`<div class="game-status"><span>第 ${g.idx+1} / ${g.items.length} 题</span><span>⭐ 已答对 ${g.score} 题</span></div><div class="progress"><div style="width:${g.idx/g.items.length*100}%"></div></div><div class="game-prompt">${esc(heading)}</div>${mode==='listen'?'<div style="text-align:center"><button class="btn primary" onclick="speak(wordGame.items[wordGame.idx][0])">🔊 播放读音</button></div>':''}<div class="game-options">${options.map(o=>`<button onclick="answerWordGame(this,${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div><div class="game-message" id="game-message" aria-live="polite"></div><div id="game-next"></div>`;
if(mode==='listen')speak(item[0]);}
function answerWordGame(btn,value){let g=wordGame;if(!g||g.locked)return;let item=g.items[g.idx],answer=g.mode==='listen'?item[0]:g.mode==='meaning'?item[2]:item[0][0];if(value===answer){g.score++;g.locked=true;btn.style.background='#dcf5e5';btn.style.borderColor='#39976a';el('game-message').textContent=`✅ 答对了！${item[0]}（${item[1]}）`;el('game-next').innerHTML='<button class="btn primary" onclick="nextWordGame()">下一题 →</button>';speak(item[0]);}else{btn.disabled=true;btn.style.background='#ffefeb';el('game-message').textContent='再想一想，试试其他答案！';}}
function nextWordGame(){wordGame.idx++;wordGame.locked=false;renderWordGame()}

// 生字词冒险：题库与错题记录共用原课文词汇；不依赖网络。
const advClues=['路上留下的脚印：右边深，左边浅。','路的左边有红枣，右边有豆子。','路旁树叶上有不完整的咬痕。','老人没有看见骆驼，只是根据痕迹推断。','沿着骆驼的脚印继续寻找。'];
let adv=null;
function advMiss(){try{return JSON.parse(localStorage.getItem('camel-missed')||'[]')}catch(e){return []}}
function advSaveMiss(v){try{localStorage.setItem('camel-missed',JSON.stringify([...new Set(v)]))}catch(e){}}
function advPool(mode){let pool=shuffleGame(gameBank);if(mode==='review'){let missed=advMiss();pool=pool.filter(x=>missed.includes(x[0]));}return pool.slice(0,mode==='memory'?6:10)}
function startAdventure(mode){let items=advPool(mode);let stage=el('adventure-stage');if(!items.length){stage.innerHTML='<h3>⭐ 暂时没有错题</h3><p>先去挑战其他小游戏吧！</p>';return}adv={mode,items,idx:0,score:0,attempt:0,locked:false,flips:[],matched:0,order:[],missed:new Set(advMiss()),wrongThisRound:new Set()};if(mode==='memory'){adv.order=shuffleGame(items.flatMap((x,i)=>[{id:i,type:'word',value:x[0]},{id:i,type:'meaning',value:x[2]}]));}renderAdventure()}
function advHead(){let a=adv;return `<div class="adv-progress"><span>第 ${Math.min(a.idx+1,a.items.length)} / ${a.items.length} 题</span><span>⭐ ${a.score} 分</span></div><div class="progress"><div style="width:${100*a.idx/a.items.length}%"></div></div>`}
function advButtons(options,kind){return `<div class="adv-choices ${kind==='adv-balloon'?'balloon-field':kind==='adv-mole'?'mole-field':''}">${options.map((o,i)=>`${kind==='adv-mole'?'<div class="mole-hole">':''}<button class="${kind||''}" data-adv="${i}" onclick="answerAdventure(${i})">${esc(o)}</button>${kind==='adv-mole'?'</div>':''}`).join('')}</div>`}
function renderAdventure(){let a=adv;if(!a)return;let stage=el('adventure-stage');if(a.mode==='memory'){renderAdvMemory();return}if(a.idx>=a.items.length){let missed=[...a.wrongThisRound];stage.innerHTML=`<h3>🎉 闯关完成！</h3><div class="adv-main">⭐ ${a.score} / ${a.items.length*10} 分</div><p>${missed.length?'本轮需要复习：'+missed.map(esc).join('、'):'全部一次答对，真棒！'}</p><div class="toolbar"><button class="btn primary" onclick="startAdventure('${a.mode}')">再玩一次</button><button class="btn" onclick="startAdventure('review')">复习错题</button></div>`;return}
let item=a.items[a.idx],opts=[],title='',kind='';if(a.mode==='balloon'){title=`${item[0]}`;opts=shuffleGame([item[1],...shuffleGame(gameBank.filter(x=>x[0]!==item[0]&&x[1]!==item[1])).slice(0,3).map(x=>x[1])]);kind='adv-balloon'}else if(a.mode==='mole'){title='🔊 听声音，点击正确的汉字';opts=shuffleGame([item[0],...shuffleGame(gameBank.filter(x=>x[0]!==item[0])).slice(0,3).map(x=>x[0])]);kind='adv-mole'}else if(a.mode==='camel'){title=`“${item[0]}”是什么意思？`;opts=shuffleGame([item[2],...shuffleGame(gameBank.filter(x=>x[0]!==item[0]&&x[2]!==item[2])).slice(0,3).map(x=>x[2])]);}else{title=`“${item[0]}”的拼音是？`;opts=shuffleGame([item[1],...shuffleGame(gameBank.filter(x=>x[0]!==item[0]&&x[1]!==item[1])).slice(0,3).map(x=>x[1])]);}
a.options=opts;a.correct=(a.mode==='balloon'||a.mode==='review')?item[1]:a.mode==='mole'?item[0]:item[2];let trail=a.mode==='camel'?`<div class="adv-trail">${['🏘️','👣','🌴','🌳','🐪'].map((x,i)=>`<span class="${i<=Math.floor(a.idx*5/a.items.length)?'reached':''}">${x}</span>`).join('')}<div class="adv-camel-marker" style="--camel-left:${Math.min(94,Math.floor(a.idx*94/a.items.length))}%">🚶</div></div><p class="adv-help">${a.idx?esc(advClues[Math.min(4,Math.floor((a.idx-1)/2))]):'答对词义题，沿着商路寻找线索'}</p>`:'';
stage.innerHTML=advHead()+trail+`<div class="adv-main">${esc(title)}</div><div class="adv-help">${a.mode==='balloon'?'点击正确拼音的气球':a.mode==='mole'?'先听发音，再找词语':'选出最合适的答案'}</div>${a.mode==='mole'?'<div style="text-align:center;margin:12px"><button class="btn primary" onclick="speak(adv.items[adv.idx][0])">🔊 再听一遍</button></div>':''}${advButtons(opts,kind)}<div class="adv-note" id="adv-note" aria-live="polite"></div><div id="adv-next"></div>`;if(a.mode==='mole')speak(item[0]);}
function answerAdventure(i){let a=adv;if(!a||a.locked)return;let v=a.options[i],correct=v===a.correct,buttons=[...el('adventure-stage').querySelectorAll('[data-adv]')],item=a.items[a.idx];if(correct){a.locked=true;if(a.attempt===0){a.score+=10;a.missed.delete(item[0])}else{a.wrongThisRound.add(item[0])}advSaveMiss([...a.missed]);buttons.forEach(b=>{b.disabled=true;if(b.textContent===a.correct)b.classList.add('good')});el('adv-note').textContent=`✓ 答对了！${item[0]}（${item[1]}）：${item[2]}。`;el('adv-next').innerHTML='<button class="btn primary" onclick="nextAdventure()">下一题 →</button>'}else{a.attempt++;a.missed.add(item[0]);a.wrongThisRound.add(item[0]);advSaveMiss([...a.missed]);buttons[i].classList.add('bad');buttons[i].disabled=true;el('adv-note').textContent=`再试试！提示：${a.mode==='camel'?item[2]:a.mode==='mole'?'仔细听读音':item[1]}。`}}
function nextAdventure(){adv.idx++;adv.attempt=0;adv.locked=false;renderAdventure()}
function renderAdvMemory(){let a=adv,stage=el('adventure-stage');if(a.matched===a.items.length){stage.innerHTML=`<h3>🎉 全部配对成功！</h3><div class="adv-main">${a.matched} 组词语全部找到！</div><p>汉字和词义配对完成。</p><button class="btn primary" onclick="startAdventure('memory')">再玩一次</button>`;return}stage.innerHTML=`<div class="adv-progress"><span>已配对 ${a.matched}/${a.items.length} 组</span><span>🃏 翻开两张卡片</span></div><div class="adv-choices">${a.order.map((c,i)=>`<button class="adv-card ${c.done?'is-done':c.face?'is-open':''}" onclick="flipAdventure(${i})" ${c.done?'disabled':''}>${c.done?'✓':c.face?esc(c.value):'❔'}</button>`).join('')}</div><div class="adv-note" id="adv-note" aria-live="polite">选择一张汉字卡和一张解释卡，让它们配成一组。</div>`}
function flipAdventure(i){let a=adv;if(!a||a.locked)return;let c=a.order[i];if(c.done||c.face)return;c.face=true;a.flips.push(i);renderAdvMemory();if(a.flips.length===2){a.locked=true;let [x,y]=a.flips.map(j=>a.order[j]);if(x.id===y.id&&x.type!==y.type){x.done=y.done=true;a.matched++;a.score+=10;setTimeout(()=>{a.flips=[];a.locked=false;renderAdvMemory()},650)}else{a.missed.add(a.items[x.id][0]);a.missed.add(a.items[y.id][0]);advSaveMiss([...a.missed]);setTimeout(()=>{x.face=y.face=false;a.flips=[];a.locked=false;renderAdvMemory()},1100)}}}
</script><script>
/* Game engine v3: independently scheduled movement and reliable cleanup. */
let ag=null,agTimers=[];
function agTimer(fn,ms,repeat=false){let id=repeat?setInterval(fn,ms):setTimeout(fn,ms);agTimers.push([id,repeat]);return id}
function agClean(){agTimers.forEach(([id,repeat])=>repeat?clearInterval(id):clearTimeout(id));agTimers=[];try{speechSynthesis.cancel()}catch(e){}}
function agSound(ok){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(ok?660:260,c.currentTime);o.frequency.exponentialRampToValueAtTime(ok?920:160,c.currentTime+.17);g.gain.setValueAtTime(.13,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.24);o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close()}catch(e){}}
function agExit(){agClean();const overlay=document.getElementById('adv-overlay');if(overlay)overlay.classList.remove('show');ag=null}
function agRoot(){let d=document.getElementById('adv-overlay');if(!d){d=document.createElement('div');d.id='adv-overlay';document.body.appendChild(d)}return d}
function agShell(title){let d=agRoot();d.innerHTML=`<div class="ag-top"><button class="ag-btn" onclick="agExit()">← 返回练习</button><strong>${title}</strong><span id="ag-counter"></span></div><div class="ag-main" id="ag-body"></div>`;d.classList.add('show');return document.getElementById('ag-body')}
function agCounter(){document.getElementById('ag-counter').textContent=ag.mode==='memory'?`已配对 ${ag.matched}/6`:`第 ${Math.min(ag.idx+1,ag.items.length)} / ${ag.items.length} 题 · ⭐ ${ag.score}分`}
function agMistake(word){ag.wrong.add(word);let a=advMiss();if(!a.includes(word))a.push(word);advSaveMiss(a)}
function agCorrect(word){let a=advMiss().filter(x=>x!==word);advSaveMiss(a)}
function startAdventure(mode){agExit();let items=advPool(mode);if(!items.length){el('adventure-stage').innerHTML='<p>目前没有错题，先玩其他游戏吧！</p>';return}ag={mode,items,idx:0,score:0,attempt:0,locked:false,wrong:new Set(),matched:0,flips:[]};if(mode==='memory')ag.cards=shuffleGame(items.flatMap((x,i)=>[{id:i,type:'word',value:x[0]},{id:i,type:'meaning',value:x[2]}]));agShell(({balloon:'🎈 拼音气球',mole:'🔨 听音打地鼠',memory:'🃏 记忆翻牌',camel:'🐪 寻找骆驼',review:'⭐ 错题再挑战'})[mode]);agRender()}
function agFinish(){agClean();let b=document.getElementById('ag-body');b.innerHTML=`<div style="text-align:center;padding:45px 15px"><div style="font-size:64px">🎉</div><h2>挑战完成！</h2><p style="font-size:27px;margin:20px">${ag.mode==='memory'?'6组配对成功':`获得 ${ag.score} 分`}</p><p>${ag.wrong.size?'本轮错题：'+[...ag.wrong].map(esc).join('、'):'全部一次答对！'}</p><div style="margin-top:25px"><button class="ag-btn ag-primary" onclick="startAdventure('${ag.mode}')">再玩一次</button> <button class="ag-btn" onclick="agExit()">返回练习</button></div></div>`;agCounter()}
function agRender(){if(!ag)return;agClean();agCounter();if(ag.mode==='memory'){agMemory();return}if(ag.idx>=ag.items.length){agFinish();return}let x=ag.items[ag.idx],b=document.getElementById('ag-body');ag.attempt=0;ag.locked=false;let mode=ag.mode;
if(mode==='balloon'){b.innerHTML=`<div class="ag-question">${esc(x[0])}</div><p class="ag-hint">点击正确拼音的气球。气球会不断上升。</p><div class="ag-field" id="ag-field"><span class="ag-cloud" style="top:5%;left:0">☁️</span><span class="ag-cloud" style="top:35%;left:20%;animation-delay:-10s">☁️</span></div><div class="ag-status" id="ag-status"></div>`;agBalloons();}
else if(mode==='mole'){b.innerHTML=`<div class="ag-question">听声音，打中正确的词语</div><div style="text-align:center"><button class="ag-btn ag-primary" onclick="speak(ag.items[ag.idx][0])">🔊 再听一次</button></div><div class="ag-field ag-hole-grid" id="ag-field"></div><div class="ag-status" id="ag-status"></div>`;agMoles();agTimer(()=>speak(x[0]),350)}
else{let opts=shuffleGame([mode==='camel'?x[2]:x[1],...shuffleGame(gameBank.filter(y=>y[0]!==x[0]&&(mode==='camel'?y[2]!==x[2]:y[1]!==x[1]))).slice(0,3).map(y=>mode==='camel'?y[2]:y[1])]);ag.opts=opts;ag.correct=mode==='camel'?x[2]:x[1];b.innerHTML=`${mode==='camel'?`<div class="ag-path"><div class="ag-road"></div><span class="ag-walker" id="ag-walker" style="--progress:${2+ag.idx*8}%">🚶</span><span class="ag-dest">🐪</span></div><p class="ag-hint">答对词义题，帮助商人沿商路寻找骆驼</p>`:''}<div class="ag-question">${mode==='camel'?`“${esc(x[0])}”是什么意思？`:`“${esc(x[0])}”的拼音是？`}</div><div class="ag-options">${opts.map((o,i)=>`<button class="ag-opt" data-ag-opt="${i}" onclick="agAnswer(${i})">${esc(o)}</button>`).join('')}</div><div class="ag-status" id="ag-status"></div>`}}
function agBalloons(){
 const field=document.getElementById('ag-field');if(!field||!ag||ag.locked)return;
 const x=ag.items[ag.idx], distractors=shuffleGame(gameBank.filter(y=>y[1]!==x[1])).slice(0,3).map(y=>y[1]);
 const opts=shuffleGame([x[1],...distractors]);ag.opts=opts;ag.correct=x[1];
 const colors=['#f8b5b1','#b7e0fa','#ffe0a0','#c5e8c1'];
 // 统一速度、随机出发时刻和水平位置；不再四个一排同步上升。
 const lanes=shuffleGame([3,26,49,72]);
 opts.forEach((v,i)=>{
   const bt=document.createElement('button');bt.className='ag-balloon';bt.textContent=v;
   bt.style.background=colors[i];bt.style.left=(lanes[i]+Math.random()*4)+'%';bt.style.bottom='-165px';
   bt.style.setProperty('--dur','11s');
   bt.style.animationDelay=(Math.random()*-5).toFixed(2)+'s';
   bt.style.setProperty('--sway',(8+Math.random()*16).toFixed(1)+'px');
   bt.onclick=()=>{if(!ag||ag.locked)return;if(v===ag.correct){bt.classList.add('ag-pop');agSuccess()}else{agMistake(x[0]);ag.attempt++;agSound(false);bt.classList.add('ag-pop');document.getElementById('ag-status').textContent='再试一次，注意声调！'}};
   field.appendChild(bt);
 });
 // 只在本题仍未答对时刷新气球，重新随机排列和出发时间。
 agTimer(()=>{if(ag&&!ag.locked&&document.getElementById('ag-field')===field){field.querySelectorAll('.ag-balloon').forEach(n=>n.remove());agBalloons()}},14500);
}
function agMoles(){
 const field=document.getElementById('ag-field'),x=ag.items[ag.idx];
 const pool=shuffleGame(gameBank.filter(y=>y[0]!==x[0])).slice(0,8).map(y=>y[0]);
 let opts=shuffleGame([x[0],...pool]);ag.opts=opts;ag.correct=x[0];
 field.innerHTML=opts.map((w,i)=>`<div class="ag-hole"><button class="ag-mole" data-mole="${i}" onclick="agMoleHit(${i})"><span class="face">🐹</span><span class="word">${esc(w)}</span></button></div>`).join('');
 let active=[];
 function pop(){
  if(!ag||ag.locked||document.getElementById('ag-field')!==field)return;
  const buttons=[...field.querySelectorAll('.ag-mole')];
  buttons.forEach(n=>n.classList.remove('up'));
  // 每一轮重新洗牌，正确词会换洞口；干扰词也跟着重新分布。
  opts=shuffleGame(opts);ag.opts=opts;
  buttons.forEach((n,i)=>{n.querySelector('.word').textContent=opts[i]});
  active=shuffleGame([...Array(9).keys()]).slice(0,3);
  // 正确答案有时出现、有时暂时躲起来，避免每轮固定位置。
  if(Math.random()<0.72&&!active.some(i=>opts[i]===x[0]))active[Math.floor(Math.random()*active.length)]=opts.indexOf(x[0]);
  // 先缩回再弹出，让位置变化清楚可见。
  agTimer(()=>{if(!ag||ag.locked)return;active.forEach(i=>buttons[i].classList.add('up'))},220);
 }
 ag.popActive=()=>active;pop();agTimer(pop,2400,true);
}
function agMoleHit(i){if(!ag||ag.locked||!ag.popActive().includes(i)||!document.querySelectorAll('#ag-field .ag-mole')[i]?.classList.contains('up'))return;let x=ag.items[ag.idx];if(ag.opts[i]===x[0])agSuccess();else{agMistake(x[0]);ag.attempt++;agSound(false);document.getElementById('ag-status').textContent='没打中正确的词，再听一次！'}}
function agAnswer(i){if(!ag||ag.locked)return;let x=ag.items[ag.idx],v=ag.opts[i],bt=document.querySelector(`[data-ag-opt="${i}"]`);if(v===ag.correct){bt.classList.add('good');agSuccess()}else{bt.classList.add('bad');bt.disabled=true;agMistake(x[0]);ag.attempt++;agSound(false);document.getElementById('ag-status').textContent='再想一想，看看词语的意思。'}}
function agSuccess(){if(!ag||ag.locked)return;ag.locked=true;let x=ag.items[ag.idx];if(!ag.attempt){ag.score+=10;agCorrect(x[0])}agSound(true);document.getElementById('ag-status').textContent=`✓ 答对了！${x[0]}（${x[1]}）：${x[2]}`;if(ag.mode==='camel'){let w=document.getElementById('ag-walker');if(w)w.style.setProperty('--progress',(Math.min(85,10+(ag.idx+1)*8))+'%')}if(ag.mode==='mole'){document.querySelectorAll('.ag-mole').forEach(n=>n.classList.remove('up'))}agTimer(()=>{ag.idx++;agRender()},1450)}
function agMemory(){let b=document.getElementById('ag-body');if(ag.matched===6){agFinish();return}b.innerHTML=`<p class="ag-hint">翻开两张卡片，找到词语与解释。配对正确会保留翻开的状态。</p><div class="ag-field ag-memory">${ag.cards.map((c,i)=>`<button class="ag-card ${c.face?'open':''} ${c.done?'done':''}" onclick="agFlip(${i})"><span class="ag-card-inner"><span class="ag-face ag-front">🐪</span><span class="ag-face ag-back">${esc(c.value)}</span></span></button>`).join('')}</div><div class="ag-status" id="ag-status">已找到 ${ag.matched} / 6 组</div>`}
function agFlip(i){if(!ag||ag.locked)return;let c=ag.cards[i];if(c.face||c.done)return;c.face=true;document.querySelectorAll('.ag-card')[i].classList.add('open');ag.flips.push(i);if(ag.flips.length===2){ag.locked=true;let [a,b]=ag.flips.map(j=>ag.cards[j]);if(a.id===b.id&&a.type!==b.type){ag.matched++;ag.score+=10;agCorrect(ag.items[a.id][0]);agSound(true);agTimer(()=>{a.done=b.done=true;ag.flips=[];ag.locked=false;agCounter();agMemory()},750)}else{agMistake(ag.items[a.id][0]);agMistake(ag.items[b.id][0]);agSound(false);agTimer(()=>{a.face=b.face=false;ag.flips=[];ag.locked=false;agMemory()},1150)}}}
</script></body></html>
