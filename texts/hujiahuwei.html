="true"><span data-tts-text="在茂密的森林里，老虎是最凶猛的野兽，号称森林之王。它每天都要捕食其他动物。"></span><span data-tts-text="一天，老虎肚子饿了，到处找东西吃。它在森林里边走边找，遇到了一只狐狸。老虎立刻扑过去，逮住了狐狸。刚要张嘴吃，狡猾的狐狸眼珠一转，大声喊道：“慢着！”"></span><span data-tts-text="“你敢吃我？天帝派我来这里当百兽之王，你要是吃了我，天帝会惩罚你的！”"></span><span data-tts-text="老虎半信半疑，慢慢地松开了爪子。狐狸摇摇尾巴，得意地说：“要是你不相信，你就跟在我后面，不论我走到哪儿，鸟兽们见了我都得逃跑。”"></span><span data-tts-text="狐狸摇头摆尾地走在前面，老虎紧紧跟着狐狸。动物们看见狐狸神气活现的样子，觉得很奇怪，再往狐狸身后一看，哎呀，老虎！都吓得飞快地跑掉了。"></span><span data-tts-text="动物们明明是害怕老虎，不是害怕狐狸，但狐狸借着老虎的威风把动物们吓跑了。"></span><span data-tts-text="狐假虎威"></span><span data-tts-text="茂密"></span><span data-tts-text="凶猛"></span><span data-tts-text="野兽"></span><span data-tts-text="号称"></span><span data-tts-text="捕食"></span><span data-tts-text="逮"></span><span data-tts-text="眼珠"></span><span data-tts-text="天帝"></span><span data-tts-text="惩罚"></span><span data-tts-text="半信半疑"></span><span data-tts-text="爪子"></span><span data-tts-text="摇头摆尾"></span><span data-tts-text="神气活现"></span><span data-tts-text="明明"></span><span data-tts-text="威风"></span></div>

  background: #667eea; color: #fff; border: none; width: 100px; height: 100px;

  box-shadow: 0 5px 20px rgba(102,126,234,0.4); transition: all 0.2s;
}
.listen-btn:hover { transform: scale(1.1); }
.listen-options { display: grid; grid-template-columns: repeat(2, 150px); gap: 20px; margin-top: 20px; justify-content: center; }
.listen-opt {
  background: #fff; color: #333; border: 3px solid #a18cd1; width: 150px; height: 150px;
  border-radius: 15px; cursor: pointer; font-size: 60px; font-weight: bold;
  font-family: &quot;KaiTi&quot;, &quot;楷体&quot;, serif; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.listen-opt:hover { background: #a18cd1; color: #fff; }
.listen-opt.correct { background: #4ade80; color: #fff; border-color: #4ade80; }
.listen-opt.wrong { background: #f87171; color: #fff; border-color: #f87171; opacity: 0.5; }
#fillGame { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
.fill-card {
  background: rgba(255,255,255,0.95); margin: 30px; padding: 40px;
  border-radius: 20px; max-width: 700px; margin-left: auto; margin-right: auto;
}
.fill-sentence {
  font-size: 22px; line-height: 2; color: #333; margin-bottom: 30px;
}
.fill-blank {
  display: inline-block; min-width: 100px; border-bottom: 3px solid #fa709a;
  text-align: center; color: #fa709a; font-weight: bold; padding: 0 10px;
}
.fill-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.fill-opt {
  background: #fa709a; color: #fff; border: none; padding: 15px;
  border-radius: 10px; cursor: pointer; font-size: 18px; transition: all 0.2s;
}
.fill-opt:hover { transform: scale(1.03); }
.fill-opt.correct { background: #4ade80; }
.fill-opt.wrong { background: #f87171; }

/* ========== 结算弹窗 ========== */
#resultModal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); z-index: 1000;
  align-items: center; justify-content: center;
}
.result-box {
  background: #fff; padding: 50px; border-radius: 20px; text-align: center;
  max-width: 400px;
}
.result-box h2 { font-size: 36px; color: #333; margin-bottom: 20px; }
.result-box .score { font-size: 48px; color: #667eea; font-weight: bold; margin-bottom: 20px; }
.result-box .stars { font-size: 40px; margin-bottom: 20px; }
.result-box button {
  background: #667eea; color: #fff; border: none; padding: 12px 30px;
  border-radius: 25px; cursor: pointer; font-size: 18px; margin: 5px;
}
.result-box button:hover { background: #764ba2; }

let timers = [];
let currentGame = null; // 记录当前在玩哪个游戏，用于&quot;再玩一次&quot;
let totalScore = 0;

function addScore(n) {
  totalScore += n;
  const el = document.getElementById(&#x27;totalScore&#x27;);
  if (el) el.textContent = totalScore;
}

function showFeedback(correct) {
  const fb = document.createElement(&#x27;div&#x27;);
  fb.className = &#x27;feedback &#x27; + (correct ? &#x27;correct&#x27; : &#x27;wrong&#x27;);
  fb.textContent = correct ? &#x27;✓ 正确!&#x27; : &#x27;✗ 再想想&#x27;;
  document.body.appendChild(fb);
  setTimeout(() =&gt; fb.remove(), 800);
}

function quitGame(gameId) {
  timers.forEach(t =&gt; clearInterval(t));
  timers = [];
  if (shootState.countdownTimer) clearInterval(shootState.countdownTimer);
  if (shootState.nextTimer) clearTimeout(shootState.nextTimer);
  if (raceState.opponentTimer) clearInterval(raceState.opponentTimer);
  if (whackState.countdownTimer) clearInterval(whackState.countdownTimer);
  if (whackState.spawnTimer) clearInterval(whackState.spawnTimer);
  if (speakState.recognition) { try { speakState.recognition.abort(); } catch(e){} }
  if (speakState.listenTimeout) clearTimeout(speakState.listenTimeout);
  if (listenState.nextTimeout) clearTimeout(listenState.nextTimeout);
  if (listenState.speakTimeout) clearTimeout(listenState.speakTimeout);
  if (memState.flipTimeout) clearTimeout(memState.flipTimeout);
  if (memState.resultTimeout) clearTimeout(memState.resultTimeout);
  // 停止语音播报
  try { speechSynthesis.cancel(); } catch(e){}
  // 游戏中途退出，把已得的分加到总分
  let s = 0;
  if (currentGame === &#x27;shoot&#x27;) s = shootState.score;
  else if (currentGame === &#x27;race&#x27;) s = Math.floor(raceState.playerDist * 2);
  else if (currentGame === &#x27;memory&#x27;) s = Math.max(0, 90 - memState.moves * 3);
  else if (currentGame === &#x27;whack&#x27;) s = whackState.score;
  else if (currentGame === &#x27;listen&#x27;) s = listenState.score;
  else if (currentGame === &#x27;speak&#x27;) s = speakState.score;
  if (s &gt; 0) addScore(s);
  // 清空游戏画面里的动态内容
  const shootArea = document.getElementById(&#x27;shootArea&#x27;);
  if (shootArea) shootArea.innerHTML = &#x27;&#x27;;
  document.getElementById(gameId).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;resultModal&#x27;).style.display = &#x27;none&#x27;;
  document.querySelectorAll(&#x27;.game-container&#x27;).forEach(g =&gt; g.style.display = &#x27;none&#x27;);
  document.getElementById(&#x27;mainMenu&#x27;).style.display = &#x27;flex&#x27;;
  currentGame = null;
  lastGameScore = 0;
}

let lastGameScore = 0; // 记录上次游戏得分，避免重复加
function showResult(score, maxScore) {
  const pct = score / maxScore;
  let stars = &#x27;⭐&#x27;;
  if (pct &gt;= 0.9) stars = &#x27;⭐⭐⭐&#x27;;
  else if (pct &gt;= 0.7) stars = &#x27;⭐⭐&#x27;;
  document.getElementById(&#x27;resultScore&#x27;).textContent = score + &#x27; 分&#x27;;
  document.getElementById(&#x27;resultStars&#x27;).textContent = stars;
  document.getElementById(&#x27;resultModal&#x27;).style.display = &#x27;flex&#x27;;
  lastGameScore = score;
}

function closeResult() {
  document.getElementById(&#x27;resultModal&#x27;).style.display = &#x27;none&#x27;;
}

function backToMenu() {
  document.getElementById(&#x27;resultModal&#x27;).style.display = &#x27;none&#x27;;
  // 把这次游戏的总分加到总分
  if (lastGameScore &gt; 0) {
    addScore(lastGameScore);
    lastGameScore = 0;
  }
  // 隐藏所有游戏
  document.querySelectorAll(&#x27;.game-container&#x27;).forEach(g =&gt; g.style.display = &#x27;none&#x27;);
  document.getElementById(&#x27;mainMenu&#x27;).style.display = &#x27;flex&#x27;;
  currentGame = null;
}

function replayGame() {
  document.getElementById(&#x27;resultModal&#x27;).style.display = &#x27;none&#x27;;
  // 再玩一次，上次加的分作废（还没加，因为只有点返回菜单才加）
  lastGameScore = 0;
  timers.forEach(t =&gt; clearTimeout(t));
  timers = [];
  if (currentGame === &#x27;shoot&#x27;) startShoot();
  else if (currentGame === &#x27;race&#x27;) startRace();
  else if (currentGame === &#x27;memory&#x27;) startMemory();
  else if (currentGame === &#x27;whack&#x27;) startWhack();
  else if (currentGame === &#x27;listen&#x27;) startListen();
  else if (currentGame === &#x27;speak&#x27;) startSpeak();
}

function shuffle(arr) {
  return arr.sort(() =&gt; Math.random() - 0.5);
}

function getRandomWords(n) {
  return shuffle([...words]).slice(0, n);
}

let shootState = { score: 0, time: 60, currentPinyin: &#x27;&#x27;, gameOver: false, usedWords: [], nextTimer: null, round: 0, countdownTimer: null };

// 音效：用Web Audio生成，不需要外部文件
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === &#x27;suspended&#x27;) ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
  if (type === &#x27;correct&#x27;) {
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    osc.type = &#x27;sine&#x27;;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } else if (type === &#x27;wrong&#x27;) {
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.setValueAtTime(200, ctx.currentTime + 0.2);
    osc.type = &#x27;sawtooth&#x27;;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } else if (type === &#x27;vroom&#x27;) {
    // 赛车加速：频率从低到高快速爬升
    osc.frequency.setValueAtTime(100, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.5);
    osc.type = &#x27;sawtooth&#x27;;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.6);
  } else if (type === &#x27;crash&#x27;) {
    // 碰撞/失误：噪音感
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
    osc.type = &#x27;square&#x27;;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  } else if (type === &#x27;finish&#x27;) {
    // 冲线胜利：上行琶音
    [523, 659, 784, 1047].forEach((f, i) =&gt; {
      osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
    });
    osc.type = &#x27;triangle&#x27;;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.8);
  } else if (type === &#x27;hammer&#x27;) {
    // 锤子敲下去：清脆的&quot;咚&quot;
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
    osc.type = &#x27;square&#x27;;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  }
  } catch(e) {}
}

function startShoot() {
  currentGame = &#x27;shoot&#x27;;
  document.getElementById(&#x27;mainMenu&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;shootGame&#x27;).style.display = &#x27;flex&#x27;;
  shootState = { score: 0, time: 60, gameOver: false, usedWords: [], nextTimer: null, round: 0, countdownTimer: null };
  updateShootUI();
  // 倒计时
  shootState.countdownTimer = setInterval(() =&gt; {
    shootState.time--;
    document.getElementById(&#x27;shootTime&#x27;).textContent = shootState.time;
    if (shootState.time &lt;= 0) {
      clearInterval(shootState.countdownTimer);
      endShoot();
    }
  }, 1000);
  timers.push(shootState.countdownTimer);
  spawnBalloon();
}
function updateShootUI() {
  document.getElementById(&#x27;shootScore&#x27;).textContent = shootState.score;
  document.getElementById(&#x27;shootTime&#x27;).textContent = shootState.time;
}
function spawnBalloon() {
  if (shootState.gameOver) return;
  const area = document.getElementById(&#x27;shootArea&#x27;);
  // 从没用过的词里随机选一个，保证不重复
  let available = words.filter(w =&gt; !shootState.usedWords.includes(w.word));
  if (available.length &lt; 4) shootState.usedWords = []; // 用完一轮重置
  available = words.filter(w =&gt; !shootState.usedWords.includes(w.word));
  const correct = available[Math.floor(Math.random() * available.length)];
  shootState.usedWords.push(correct.word);
  shootState.round++;
  document.getElementById(&#x27;shootRound&#x27;).textContent = shootState.round;
  shootState.currentPinyin = correct.pinyin;
  document.getElementById(&#x27;shootHint&#x27;).innerHTML = `&lt;span style=&quot;color:#ffe066;font-size:32px;font-weight:bold;&quot;&gt;${correct.word}&lt;/span&gt;`;
  
  const colors = [&#x27;#ff6b6b&#x27;, &#x27;#4ecdc4&#x27;, &#x27;#45b7d1&#x27;, &#x27;#96ceb4&#x27;, &#x27;#feca57&#x27;, &#x27;#ff9ff3&#x27;];
  // 生成4个气球，正确答案随机出现在其中一个位置
  const balloonCount = 4;
  const correctIndex = Math.floor(Math.random() * balloonCount);
  const thisRoundBalloons = []; // 保存这一批所有气球，答对后一起清掉
  for (let i = 0; i &lt; balloonCount; i++) {
    const isCorrect = i === correctIndex;
    // 错误选项也尽量不重复
    let w;
    if (isCorrect) {
      w = correct;
    } else {
      do {
        w = words[Math.floor(Math.random() * words.length)];
      } while (w.pinyin === correct.pinyin);
    }
    const balloon = document.createElement(&#x27;div&#x27;);
    balloon.className = &#x27;balloon&#x27;;
    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
    balloon.style.left = (10 + i * 22 + Math.random() * 5) + &#x27;%&#x27;;
    balloon.style.top = &#x27;-120px&#x27;;
    balloon.textContent = w.pinyin;
    balloon.dataset.correct = isCorrect;
    thisRoundBalloons.push(balloon);
    
    balloon.onclick = function() {
      if (this.dataset.correct === &#x27;true&#x27;) {
        shootState.score += 10;
        updateShootUI();
        showFeedback(true);
        playSound(&#x27;correct&#x27;);
        // 答对后立刻清掉这一批所有气球，不等落到底
        thisRoundBalloons.forEach(b =&gt; b.remove());
        // 清除原来的定时器，立刻出下一题
        if (shootState.nextTimer) { clearTimeout(shootState.nextTimer); shootState.nextTimer = null; }
        setTimeout(spawnBalloon, 500); // 稍微停一下看反馈，然后立刻出下一题
      } else {
        shootState.time = Math.max(0, shootState.time - 3);
        showFeedback(false);
        playSound(&#x27;wrong&#x27;);
        updateShootUI();
      }
    };
    
    area.appendChild(balloon);
    
    // 气球下落动画（放慢速度，给学生更多反应时间）
    const duration = 7000 + Math.random() * 3000;
    const start = Date.now();
    function fall() {
      if (!balloon.parentNode) return;
      const elapsed = Date.now() - start;
      const y = (elapsed / duration) * (area.offsetHeight + 120) - 120;
      balloon.style.top = y + &#x27;px&#x27;;
      if (y &lt; area.offsetHeight) {
        requestAnimationFrame(fall);
      } else {
        balloon.remove();
        if (balloon.dataset.correct === &#x27;true&#x27;) {
          shootState.time = Math.max(0, shootState.time - 5);
          updateShootUI();
        }
      }
    }
    requestAnimationFrame(fall);
  }
  
  // 定时生成下一批（只有没答的时候才等，答对会立刻触发）
  shootState.nextTimer = setTimeout(spawnBalloon, 10000);
  timers.push(shootState.nextTimer);
}
function endShoot() {
  shootState.gameOver = true;
  showResult(shootState.score, 100);
}

  document.getElementById(&#x27;tetrisGame&#x27;).style.display = &#x27;block&#x27;;
  tetrisState = { score: 0, lines: 0, currentWord: null, fallInterval: null, currentRow: 0, currentCol: 0 };
  buildTetrisBoard();
  nextTetrisWord();
}
function buildTetrisBoard() {
  const board = document.getElementById(&#x27;tetrisBoard&#x27;);
  board.innerHTML = &#x27;&#x27;;
  for (let i = 0; i &lt; 96; i++) {
    const cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;tetris-cell&#x27;;
    board.appendChild(cell);
  }
}
function nextTetrisWord() {
  tetrisState.currentWord = words[Math.floor(Math.random() * words.length)];
  document.getElementById(&#x27;currentWord&#x27;).textContent = tetrisState.currentWord.word;
  // 生成4个拼音选项
  const opts = [tetrisState.currentWord];
  while (opts.length &lt; 4) {
    const w = words[Math.floor(Math.random() * words.length)];
    if (!opts.find(o =&gt; o.pinyin === w.pinyin)) opts.push(w);
  }
  shuffle(opts);
  const optDiv = document.getElementById(&#x27;tetrisOptions&#x27;);
  optDiv.innerHTML = &#x27;&#x27;;
  opts.forEach(o =&gt; {
    const btn = document.createElement(&#x27;button&#x27;);
    btn.className = &#x27;tetris-opt&#x27;;
    btn.textContent = o.pinyin;
    btn.onclick = () =&gt; checkTetris(o.pinyin);
    optDiv.appendChild(btn);
  });
  dropTetrisBlock();
}
function dropTetrisBlock() {
  const board = document.getElementById(&#x27;tetrisBoard&#x27;);
  const cells = board.children;
  // 在顶部随机位置放一个带词语的方块
  let col;
  do {
    col = Math.floor(Math.random() * 8);
  } while (cells[col].classList.contains(&#x27;filled&#x27;)); // 顶部被占就换一列
  tetrisState.currentCol = col;
  tetrisState.currentRow = 0;
  cells[0 * 8 + col].classList.add(&#x27;filled&#x27;);
  cells[0 * 8 + col].textContent = tetrisState.currentWord.word;
  
  // 方块下落
  const fall = setInterval(() =&gt; {
    // 清除当前位置
    cells[tetrisState.currentRow * 8 + col].classList.remove(&#x27;filled&#x27;);
    cells[tetrisState.currentRow * 8 + col].textContent = &#x27;&#x27;;
    tetrisState.currentRow++;
    // 碰到底部或下面有方块就停
    if (tetrisState.currentRow &gt;= 12 || cells[tetrisState.currentRow * 8 + col].classList.contains(&#x27;filled&#x27;)) {
      tetrisState.currentRow--;
      cells[tetrisState.currentRow * 8 + col].classList.add(&#x27;filled&#x27;);
      cells[tetrisState.currentRow * 8 + col].textContent = tetrisState.currentWord.word;
      clearInterval(fall);
      // 没答题就落到底，算错过
      showFeedback(false);
      tetrisState.score = Math.max(0, tetrisState.score - 5);
      document.getElementById(&#x27;tetrisScore&#x27;).textContent = tetrisState.score;
      // 检查堆到顶没
      if (tetrisState.currentRow &lt;= 1) {
        endTetris();
        return;
      }
      setTimeout(() =&gt; nextTetrisWord(), 500);
      return;
    }
    cells[tetrisState.currentRow * 8 + col].classList.add(&#x27;filled&#x27;);
    cells[tetrisState.currentRow * 8 + col].textContent = tetrisState.currentWord.word;
  }, 1000);
  tetrisState.fallInterval = fall;
}
function checkTetris(pinyin) {
  clearInterval(tetrisState.fallInterval);
  const board = document.getElementById(&#x27;tetrisBoard&#x27;);
  const cells = board.children;
  const { currentRow, currentCol, currentWord } = tetrisState;
  
  if (pinyin === currentWord.pinyin) {
    // 答对：方块留在原地
    tetrisState.score += 10;
    tetrisState.lines++;
    showFeedback(true);
    playSound(&#x27;correct&#x27;);
    // 检查是否有整行填满
    checkFullRows();
  } else {
    // 答错：方块消失
    cells[currentRow * 8 + currentCol].classList.remove(&#x27;filled&#x27;);
    cells[currentRow * 8 + currentCol].textContent = &#x27;&#x27;;
    showFeedback(false);
    playSound(&#x27;wrong&#x27;);
    tetrisState.score = Math.max(0, tetrisState.score - 5);
  }
  document.getElementById(&#x27;tetrisScore&#x27;).textContent = tetrisState.score;
  document.getElementById(&#x27;tetrisLines&#x27;).textContent = tetrisState.lines;
  
  if (tetrisState.lines &gt;= 10) {
    endTetris();
  } else {
    nextTetrisWord();
  }
}
function checkFullRows() {
  const board = document.getElementById(&#x27;tetrisBoard&#x27;);
  const cells = board.children;
  for (let row = 11; row &gt;= 0; row--) {
    let full = true;
    for (let col = 0; col &lt; 8; col++) {
      if (!cells[row * 8 + col].classList.contains(&#x27;filled&#x27;)) {
        full = false;
        break;
      }
    }
    if (full) {
      // 消除这一行，上面的落下来
      for (let r = row; r &gt;= 0; r--) {
        for (let col = 0; col &lt; 8; col++) {
          const above = cells[(r - 1) * 8 + col];
          const current = cells[r * 8 + col];
          if (r === 0) {
            current.classList.remove(&#x27;filled&#x27;);
            current.textContent = &#x27;&#x27;;
          } else {
            current.className = above.className;
            current.textContent = above.textContent;
          }
        }
      }
      row++; // 重新检查这一行
      tetrisState.score += 30;
      showFeedback(true);
    }
  }
}
function endTetris() {
  clearInterval(tetrisState.fallInterval);
  showResult(tetrisState.score, 200);
}

let raceState = { round: 1, playerDist: 0, oppDist: 0, totalRounds: 10, opponentTimer: null };
function startRace() {
  currentGame = &#x27;race&#x27;;

function nextRaceQuestion() {
  if (currentGame !== &#x27;race&#x27;) return;
  document.getElementById(&#x27;raceRound&#x27;).textContent = raceState.round;
  document.getElementById(&#x27;raceProgress&#x27;).textContent = raceState.playerDist;
  
  const w = words[Math.floor(Math.random() * words.length)];
  document.getElementById(&#x27;raceWord&#x27;).textContent = w.word;
  
  // 生成4个释义选项
  const opts = [w.meaning];
  while (opts.length &lt; 4) {
    const mw = words[Math.floor(Math.random() * words.length)];
    if (!opts.includes(mw.meaning)) opts.push(mw.meaning);
  }
  shuffle(opts);
  const optDiv = document.getElementById(&#x27;raceOptions&#x27;);
  optDiv.innerHTML = &#x27;&#x27;;
  opts.forEach(o =&gt; {
    const btn = document.createElement(&#x27;button&#x27;);
    btn.className = &#x27;race-opt&#x27;;
    btn.textContent = o;
    btn.onclick = function() {
      // 禁用所有按钮，防止重复点击
      optDiv.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.disabled = true);
      if (o === w.meaning) {
        this.classList.add(&#x27;correct&#x27;);
        raceState.playerDist += 30;
        showFeedback(true);
        try { playSound(&#x27;vroom&#x27;); } catch(e) {}
      } else {
        this.classList.add(&#x27;wrong&#x27;);
        raceState.oppDist += 25;
        showFeedback(false);
        try { playSound(&#x27;crash&#x27;); } catch(e) {}
      }
      updateRaceCars();
      setTimeout(() =&gt; {
        raceState.round++;
        if (raceState.round &gt; raceState.totalRounds || raceState.playerDist &gt;= 300 || raceState.oppDist &gt;= 300) {
          clearInterval(raceState.opponentTimer);
          endRace();
        } else {
          nextRaceQuestion();
        }
      }, 1000);
    };
    optDiv.appendChild(btn);
  });
}
function updateRaceCars() {
  const track = document.querySelector(&#x27;.race-track&#x27;);
  const maxDist = track.offsetWidth - 100;
  const playerPct = Math.min(raceState.playerDist / 300, 1);
  const oppPct = Math.min(raceState.oppDist / 300, 1);
  document.querySelector(&#x27;.player-car&#x27;).style.left = (50 + playerPct * maxDist) + &#x27;px&#x27;;
  document.querySelector(&#x27;.opponent-car&#x27;).style.left = (50 + oppPct * maxDist) + &#x27;px&#x27;;
}
function endRace() {
  clearInterval(raceState.opponentTimer);
  playSound(&#x27;finish&#x27;);
  const won = raceState.playerDist &gt;= raceState.oppDist;
  const title = won ? &#x27;🏆 恭喜你获得冠军！&#x27; : &#x27;😅 很遗憾，继续加油！&#x27;;
  setTimeout(() =&gt; {
    document.getElementById(&#x27;resultTitle&#x27;).textContent = title;
  }, 100);
  showResult(raceState.playerDist * 2, 600);
}

const allSynonymPairs=[[&quot;狐假虎威&quot;, &quot;比喻倚仗别人的权势来欺压或吓唬人。&quot;], [&quot;茂密&quot;, &quot;草木生长得又多又密。&quot;], [&quot;凶猛&quot;, &quot;凶恶而猛烈。&quot;], [&quot;野兽&quot;, &quot;生活在野外的兽类。&quot;], [&quot;号称&quot;, &quot;以某种称号自称或被人称作。&quot;], [&quot;捕食&quot;, &quot;动物捕捉其他生物作为食物。&quot;], [&quot;逮&quot;, &quot;捉住。&quot;], [&quot;眼珠&quot;, &quot;眼球；眼睛中能转动的部分。&quot;], [&quot;天帝&quot;, &quot;神话中天上的最高统治者。&quot;], [&quot;惩罚&quot;, &quot;对错误行为给予处罚。&quot;], [&quot;半信半疑&quot;, &quot;有些相信，又有些怀疑。&quot;], [&quot;爪子&quot;, &quot;鸟兽的脚，通常有尖锐的指甲。&quot;], [&quot;摇头摆尾&quot;, &quot;摇动头和尾巴，形容得意的样子。&quot;], [&quot;神气活现&quot;, &quot;自以为了不起，显得十分得意的样子。&quot;], [&quot;明明&quot;, &quot;表示情况显然如此。&quot;], [&quot;威风&quot;, &quot;使人敬畏的气势。&quot;]];
function startMemory() {
  currentGame = &#x27;memory&#x27;;
  document.getElementById(&#x27;mainMenu&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;memoryGame&#x27;).style.display = &#x27;flex&#x27;;
  memState = { firstCard: null, matched: 0, moves: 0, lock: false };
  document.getElementById(&#x27;memMatched&#x27;).textContent = &#x27;0&#x27;;
  document.getElementById(&#x27;memMoves&#x27;).textContent = &#x27;0&#x27;;
  
  // 随机选6对近义词
  const chosenPairs = shuffle([...allSynonymPairs]).slice(0, 6);
  const cards = [];
  chosenPairs.forEach(pair =&gt; {
    cards.push({ text: pair[0], pair: pair[0] + pair[1] });
    cards.push({ text: pair[1], pair: pair[0] + pair[1] });
  });
  shuffle(cards);
  
  const board = document.getElementById(&#x27;memoryBoard&#x27;);
  board.innerHTML = &#x27;&#x27;;
  cards.forEach((c, i) =&gt; {
    const card = document.createElement(&#x27;div&#x27;);
    card.className = &#x27;mem-card&#x27;;
    card.dataset.pair = c.pair;
    card.innerHTML = `
      &lt;div class=&quot;mem-card-inner&quot;&gt;
        &lt;div class=&quot;mem-front&quot;&gt;❓&lt;/div&gt;
        &lt;div class=&quot;mem-back&quot;&gt;${c.text}&lt;/div&gt;
      &lt;/div&gt;`;

function flipCard(card) {
  if (memState.lock || card.classList.contains(&#x27;flipped&#x27;) || card.classList.contains(&#x27;matched&#x27;)) return;
  card.classList.add(&#x27;flipped&#x27;);
  
  if (!memState.firstCard) {
    memState.firstCard = card;
  } else {
    memState.moves++;
    document.getElementById(&#x27;memMoves&#x27;).textContent = memState.moves;
    if (memState.firstCard.dataset.pair === card.dataset.pair &amp;&amp; memState.firstCard !== card) {
      memState.firstCard.classList.add(&#x27;matched&#x27;);
      card.classList.add(&#x27;matched&#x27;);
      memState.matched++;
      document.getElementById(&#x27;memMatched&#x27;).textContent = memState.matched;
      showFeedback(true);
      playSound(&#x27;correct&#x27;);
      addScore(15);
      memState.firstCard = null;
      if (memState.matched &gt;= 6) {
        memState.resultTimeout = setTimeout(() =&gt; {
          if (currentGame === &#x27;memory&#x27;) showResult(90 - memState.moves * 3, 90);
        }, 500);
      }
    } else {
      memState.lock = true;
      playSound(&#x27;wrong&#x27;);
      memState.flipTimeout = setTimeout(() =&gt; {
        if (currentGame !== &#x27;memory&#x27;) return;
        memState.firstCard.classList.remove(&#x27;flipped&#x27;);
        card.classList.remove(&#x27;flipped&#x27;);
        memState.firstCard = null;
        memState.lock = false;
        showFeedback(false);
      }, 800);
    }
  }
}

function spawnMoles() {
  if (whackState.time &lt;= 0) return;
  const holes = document.querySelectorAll(&#x27;.hole&#x27;);
  holes.forEach(h =&gt; {
    const mole = h.querySelector(&#x27;.mole&#x27;);
    mole.classList.remove(&#x27;up&#x27;);
    mole.onclick = null;
  });
  
  // 当前目标词
  const target = words.find(w =&gt; w.pinyin === whackState.targetPinyin);
  // 准备3个地鼠：1个正确 + 2个干扰
  const moleWords = [target];
  while (moleWords.length &lt; 3) {
    const w = words[Math.floor(Math.random() * words.length)];
    if (!moleWords.find(mw =&gt; mw.word === w.word)) moleWords.push(w);
  }
  shuffle(moleWords);
  
  // 选3个洞冒地鼠

  activeHoles.forEach((h, i) =&gt; {
    const mole = h.querySelector(&#x27;.mole&#x27;);
    const moleWord = mole.querySelector(&#x27;.mole-word&#x27;);
    const w = moleWords[i];
    moleWord.textContent = w.word;

      e.stopPropagation();
      if (w.pinyin === whackState.targetPinyin) {

        playSound(&#x27;hammer&#x27;);

      document.getElementById(&#x27;whackScore&#x27;).textContent = whackState.score;
    };
    setTimeout(() =&gt; mole.classList.add(&#x27;up&#x27;), i * 200);
  });

  timers.push(t);

  // 解锁语音播放：先触发一下空语音，绕过浏览器自动播放限制
  const unlock = new SpeechSynthesisUtterance(&#x27; &#x27;);
  unlock.volume = 0;
  speechSynthesis.speak(unlock);
  // 优先选上一轮没出过的字，重复率不超过15%（10题最多重复1-2个）
  const freshPool = characterBank.filter(c =&gt; !listenState.lastRoundChars.includes(c.char));
  const oldPool = characterBank.filter(c =&gt; listenState.lastRoundChars.includes(c.char));
  // 8个从新的里选，2个从旧的里选（重复率20%以内）
  const chosenFresh = shuffle([...freshPool]).slice(0, 8);
  const chosenOld = shuffle([...oldPool]).slice(0, 2);
  listenState.questions = shuffle([...chosenFresh, ...chosenOld]);
  // 记录这轮用了哪些字
  listenState.lastRoundChars = listenState.questions.map(q =&gt; q.char);
  nextListen();
}
function nextListen() {
  if (currentGame !== &#x27;listen&#x27;) return; // 已退出游戏，不继续
  if (listenState.idx &gt;= listenState.questions.length) {
    showResult(listenState.score, 100);
    return;
  }
  document.getElementById(&#x27;listenNum&#x27;).textContent = listenState.idx + 1;
  document.getElementById(&#x27;listenScore&#x27;).textContent = listenState.score;
  
  const q = listenState.questions[listenState.idx];
  listenState.currentChar = q.char;
  listenState.currentHint = q.hint;
  const opts = shuffle([...q.options]);
  
  const optDiv = document.getElementById(&#x27;listenOptions&#x27;);
  optDiv.innerHTML = &#x27;&#x27;;
  opts.forEach(o =&gt; {
    const btn = document.createElement(&#x27;button&#x27;);
    btn.className = &#x27;listen-opt&#x27;;
    btn.textContent = o;
    btn.onclick = function() {
      if (o === q.char) {
        this.classList.add(&#x27;correct&#x27;);
        listenState.score += 10;
        showFeedback(true);
        playSound(&#x27;correct&#x27;);
        // 答对后禁用所有按钮，等一下进下一题
        optDiv.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.disabled = true);
        listenState.nextTimeout = setTimeout(() =&gt; {
          listenState.idx++;
          nextListen();
        }, 1000);
      } else {
        this.classList.add(&#x27;wrong&#x27;);
        this.disabled = true; // 答错的按钮禁用，可以继续选其他的
        showFeedback(false);
        playSound(&#x27;wrong&#x27;);
      }

    optDiv.appendChild(btn);

let speakState = { idx: 0, score: 0, currentWord: null, tries: 0, recognition: null, autoListen: true, listenTimeout: null, permissionGranted: false };
function startSpeak() {
  currentGame = &#x27;speak&#x27;;
  document.getElementById(&#x27;mainMenu&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;speakGame&#x27;).style.display = &#x27;flex&#x27;;
  speakState = { idx: 0, score: 0, currentWord: null, tries: 0, recognition: null, autoListen: true };
  speakState.questions = shuffle([...words]).slice(0, 10);
  nextSpeak();
}
function nextSpeak() {
  if (speakState.idx &gt;= speakState.questions.length) {
    endSpeak();
    return;
  }
  document.getElementById(&#x27;speakNum&#x27;).textContent = speakState.idx + 1;
  document.getElementById(&#x27;speakScore&#x27;).textContent = speakState.score;
  speakState.currentWord = speakState.questions[speakState.idx];

    document.getElementById(&#x27;speakStatus&#x27;).style.color = &#x27;#4ade80&#x27;;

    document.getElementById(&#x27;micBtn&#x27;).classList.remove(&#x27;recording&#x27;);
  }

function endSpeak() {

function startListening() {

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById(&#x27;speakStatus&#x27;).textContent = &#x27;浏览器不支持语音识别，请用Chrome或Edge&#x27;;

  }
  // 先停掉旧的
  if (speakState.recognition) { try { speakState.recognition.abort(); } catch(e){} }

  // 8秒超时保护：没声音就重新开始听

    let correct = (said === target) || said.includes(target) || target.includes(said);

        }
      }

      document.getElementById(&#x27;speakScore&#x27;).textContent = speakState.score;

        showFeedback(false);

        showFeedback(false);
        playSound(&#x27;wrong&#x27;);

      }
    }
  };

    } else if (e.error === &#x27;network&#x27;) {

    }
  };

    recognition.start();
  } catch(e) {}
}

</script><script>const wbSections=[{"title": "一 选拼音组词", "intro": "先选择正确拼音，再组一个词语。", "questions": [{"t": "帝：选择拼音，再组词", "a": "dì；天帝", "k": "pinyinword", "o": ["dì", "tí"], "p": "dì"}, {"t": "旁：选择拼音，再组词", "a": "páng；旁边", "k": "pinyinword", "o": ["páng", "bàng"], "p": "páng"}, {"t": "凶：选择拼音，再组词", "a": "xiōng；凶猛", "k": "pinyinword", "o": ["xiōng", "xiòng"], "p": "xiōng"}, {"t": "区：选择拼音，再组词", "a": "qū；地区", "k": "pinyinword", "o": ["qū", "ōu"], "p": "qū"}, {"t": "虎：选择拼音，再组词", "a": "hǔ；老虎", "k": "pinyinword", "o": ["hǔ", "hū"], "p": "hǔ"}, {"t": "虚：选择拼音，再组词", "a": "xū；虚心", "k": "pinyinword", "o": ["xū", "xú"], "p": "xū"}, {"t": "轻：选择拼音，再组词", "a": "qīng；轻松", "k": "pinyinword", "o": ["qīng", "jīng"], "p": "qīng"}, {"t": "经：选择拼音，再组词", "a": "jīng；经过", "k": "pinyinword", "o": ["jīng", "qīng"], "p": "jīng"}, {"t": "兽：选择拼音，再组词", "a": "shòu；野兽", "k": "pinyinword", "o": ["shòu", "sòu"], "p": "shòu"}, {"t": "善：选择拼音，再组词", "a": "shàn；善良", "k": "pinyinword", "o": ["shàn", "sàn"], "p": "shàn"}, {"t": "威：选择拼音，再组词", "a": "wēi；威风", "k": "pinyinword", "o": ["wēi", "wèi"], "p": "wēi"}, {"t": "戚：选择拼音，再组词", "a": "qī；亲戚", "k": "pinyinword", "o": ["qī", "qì"], "p": "qī"}]}, {"title": "二 选词填空", "intro": "选择合适的词语填入句子。", "questions": [{"t": "无论是谁犯了罪，都要受到法律的______。", "a": "惩罚", "k": "choice", "o": ["惩罚", "茂密", "凶猛", "号称"]}, {"t": "虎和豹都是______的野兽。", "a": "凶猛", "k": "choice", "o": ["惩罚", "茂密", "凶猛", "号称"]}, {"t": "珠穆朗玛峰______“世界屋脊”。", "a": "号称", "k": "choice", "o": ["惩罚", "茂密", "凶猛", "号称"]}, {"t": "学校的后面是一片______的树林。", "a": "茂密", "k": "choice", "o": ["惩罚", "茂密", "凶猛", "号称"]}, {"t": "那只狗就是喜欢______，要是主人不在身边，它也就不敢这么大声叫了。", "a": "狐假虎威", "k": "choice", "o": ["狐假虎威", "半信半疑", "神气活现", "摇头摆尾"]}, {"t": "弟弟一进家门，小狗就______地跑了过去。", "a": "摇头摆尾", "k": "choice", "o": ["狐假虎威", "半信半疑", "神气活现", "摇头摆尾"]}, {"t": "对他的话，大家都是______。", "a": "半信半疑", "k": "choice", "o": ["狐假虎威", "半信半疑", "神气活现", "摇头摆尾"]}, {"t": "看他们______的样子，就知道一定是他们赢了。", "a": "神气活现", "k": "choice", "o": ["狐假虎威", "半信半疑", "神气活现", "摇头摆尾"]}]}, {"title": "三 完成句子", "intro": "用“明明”完成句子，参考答案不唯一。", "questions": [{"t": "______，现在怎么没有了？（明明）", "a": "明明刚才还在这里", "k": "text", "o": []}, {"t": "______，你为什么说不知道？（明明）", "a": "明明你已经知道答案", "k": "text", "o": []}, {"t": "______，为什么不接受批评？（明明）", "a": "明明是你做错了", "k": "text", "o": []}, {"t": "明明是他的错，______。", "a": "他却不肯承认", "k": "text", "o": []}, {"t": "明明他不喜欢______，你何必______？", "a": "吃辣的东西；非要他吃呢", "k": "text", "o": []}]}, {"title": "四 回答问题", "intro": "用完整的句子回答，先思考，再查看参考答案。", "questions": [{"t": "在“狐假虎威”的故事中，动物们真的怕狐狸吗？为什么？", "a": "不是。动物们是看见狐狸身后的老虎才吓得逃跑的。", "k": "text", "o": []}, {"t": "成语“狐假虎威”中的“假”是什么意思？", "a": "“假”是借用、凭借的意思。", "k": "text", "o": []}]}];let wbIndex=0;const wbSaved={};function wbEscape(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function wbSave(){document.querySelectorAll('#wbContent [data-wbi]').forEach(el=>{wbSaved[wbIndex+':'+el.dataset.wbi]=el.value})}function wbOpen(i){wbSave();wbIndex=i;document.getElementById('wbTabs').innerHTML=wbSections.map((x,j)=>`<button class="${j===i?'active':''}" onclick="wbOpen(${j})">${x.title}</button>`).join('');let sec=wbSections[i];document.getElementById('wbContent').innerHTML=`<div class="wb-top"><h3>${sec.title}</h3><span class="wb-counter">${sec.questions.filter(x=>x.k!=='note'&&x.k!=='passage').length} 题</span></div><p class="muted">${sec.intro}</p>`+sec.questions.map((x,j)=>{if(x.k==='passage')return `<div class="wb-passage">${wbEscape(x.t)}</div>`;if(x.k==='note')return `<div class="wb-words">${wbEscape(x.t)}</div>`;let control=x.k==='pinyinword'?`<div class="wb-options">${x.o.map(o=>`<button onclick="wbCheckPinyin(this,${j})">${wbEscape(o)}</button>`).join('')}</div><label style="display:block;margin-top:12px">组词：</label><textarea class="wb-textarea" data-wbi="${j}" rows="2" placeholder="用这个字组一个词语……">${wbEscape(wbSaved[i+':'+j]||'')}</textarea>`:x.k==='choice'?`<div class="wb-options">${x.o.map(o=>`<button onclick="wbCheck(this,${j})">${wbEscape(o)}</button>`).join('')}</div>`:x.t.length>80?`<textarea class="wb-textarea" data-wbi="${j}" placeholder="在这里填写答案……">${wbEscape(wbSaved[i+':'+j]||'')}</textarea>`:`<textarea class="wb-textarea" data-wbi="${j}" rows="2" placeholder="在这里填写答案……">${wbEscape(wbSaved[i+':'+j]||'')}</textarea>`;return `<div class="wb-question"><strong>${j+1}. ${wbEscape(x.t)}</strong>${control}<div class="wb-feedback"></div><button style="margin-top:10px" onclick="wbToggle(this)">查看${x.k==='choice'?'正确':'参考'}答案</button><div class="wb-answer">${wbEscape(x.a)}</div></div>`}).join('')+`<div class="actions"><button onclick="wbOpen(Math.max(0,wbIndex-1))" ${i===0?'disabled':''}>上一部分</button><button onclick="wbOpen(Math.min(wbSections.length-1,wbIndex+1))" ${i===wbSections.length-1?'disabled':''}>下一部分</button></div>`}function wbCheckPinyin(btn,j){const x=wbSections[wbIndex].questions[j];const box=btn.closest('.wb-question');const ok=btn.textContent===x.p;btn.classList.add(ok?'good':'bad');box.querySelector('.wb-feedback').textContent=ok?'✓ 拼音选对了！请继续组词。':'再想一想。';if(ok)box.querySelectorAll('.wb-options button').forEach(b=>b.disabled=true);else btn.disabled=true}function wbCheck(btn,j){let x=wbSections[wbIndex].questions[j];let box=btn.closest('.wb-question');let ok=btn.textContent===x.a;btn.classList.add(ok?'good':'bad');box.querySelector('.wb-feedback').textContent=ok?'✓ 回答正确！':'再想一想。';if(ok)box.querySelectorAll('.wb-options button').forEach(b=>b.disabled=true);else btn.disabled=true}function wbToggle(btn){let el=btn.nextElementSibling;el.classList.toggle('show');btn.textContent=el.classList.contains('show')?'收起答案':'查看参考答案'}wbOpen(0);</script></body></html>
