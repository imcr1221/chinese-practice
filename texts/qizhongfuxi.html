"}, {"text": "爸爸____我先洗手再吃饭。", "choices": ["叫", "问", "告诉"], "correct": 0, "target": "叫"}, {"text": "他决定向法官____那个骗人钱财的人。", "choices": ["说", "讲", "告"], "correct": 2, "target": "告"}], "answer": "1. 求\n2. 直\n3. 再三\n4. 味\n5. 叫\n6. 告", "group": false}, {"title": "04 · 情境选词 2", "mins": 0, "tag": "情境选词", "intro": "读完整个句子或情境，选出最准确的一项。完成后检查答案。", "questions": [{"text": "水管漏水，地板一直积水。维修人员换好水管后，漏水停止了。可以说：“漏水的问题终于____了。”", "choices": ["解决", "解答", "解释"], "correct": 0, "target": "解决"}, {"text": "“背包实在太重了”中的“实在”是什么意思？", "choices": ["确实", "诚实", "现实"], "correct": 0, "target": "实在"}, {"text": "他用难听的话攻击别人。这种行为可以说是____人。", "choices": ["骂", "劝", "夸"], "correct": 0, "target": "骂"}, {"text": "“不能随便拿____的东西”中，哪个词表示别人？", "choices": ["人家", "自己", "自家"], "correct": 0, "target": "人家"}, {"text": "买好东西后，我把钱____给了收银员。", "choices": ["付", "收", "借"], "correct": 0, "target": "付"}, {"text": "他把手伸进口袋，____出钥匙，准备开门。", "choices": ["塞", "掏", "藏"], "correct": 1, "target": "掏"}], "answer": "1. 解决\n2. 确实\n3. 骂\n4. 人家\n5. 付\n6. 掏\n\n用法说明\n解决：消除困难或问题。水管修好后不再漏水，是解决了问题；解答是回答问题，解释是说明原因或意思。\n实在：这里表示“确实”，用来强调背包很重。\n骂：用难听的话攻击别人；劝是说服、劝导，夸是赞扬。\n掏出：伸手到里面，把东西取出来；塞入、藏起的动作方向和目的不同。", "group": false}, {"title": "04 · 情境选词 3", "mins": 0, "tag": "情境选词", "intro": "读完整个句子或情境，选出最准确的一项。完成后检查答案。", "questions": [{"text": "花香散布在花园的整个空间里。哪个词最准确地描述这种状态？", "choices": ["飘荡", "飘动", "弥漫"], "correct": 2, "target": "弥漫"}, {"text": "悠扬的歌声在山谷里____。", "choices": ["飘动", "飘荡", "漂浮"], "correct": 1, "target": "飘荡"}, {"text": "微风吹来，窗边的丝带轻轻____。", "choices": ["漂浮", "流动", "飘动"], "correct": 2, "target": "飘动"}, {"text": "开心的消息让她主动笑出了声，忍不住____大笑。", "choices": ["发声", "放声", "失声"], "correct": 1, "target": "放声"}, {"text": "新邻居____地邀请我们到家里做客。", "choices": ["热闹", "热烈", "热情"], "correct": 2, "target": "热情"}, {"text": "台上问“谁愿意参加”，观众们____举手，许多人同时表示愿意。", "choices": ["再三", "纷纷", "接二连三"], "correct": 1, "target": "纷纷"}], "answer": "1. 弥漫\n2. 飘荡\n3. 飘动\n4. 放声\n5. 热情\n6. 纷纷\n\n用法说明\n弥漫：气味、烟雾等散布在空间里；飘荡侧重随风摇荡或传播，飘动侧重物体随风移动。", "group": false}, {"title": "04 · 情境选词 4", "mins": 0, "tag": "情境选词", "intro": "读完整个句子或情境，选出最准确的一项。完成后检查答案。", "questions": [{"text": "天气太干，土地____开了。", "choices": ["破", "碎", "裂"], "correct": 2, "target": "裂"}, {"text": "工作人员张开双臂，不让人从入口进去。他是在____人。", "choices": ["迎", "拦", "送"], "correct": 1, "target": "拦"}, {"text": "知道他昨晚没睡好后，我觉得他今天这么困并不奇怪。哪个词能表达“明白原因后不再奇怪”？", "choices": ["因为", "所以", "难怪"], "correct": 2, "target": "难怪"}, {"text": "我希望这份友谊能____保持下去。", "choices": ["暂时", "永远", "片刻"], "correct": 1, "target": "永远"}, {"text": "下雨时，我们____在屋里看书。", "choices": ["停", "居", "待"], "correct": 2, "target": "待"}, {"text": "做小组任务时，不能只____自己，不考虑同伴。", "choices": ["管着", "顾", "照"], "correct": 1, "target": "顾"}], "answer": "1. 裂\n2. 拦\n3. 难怪\n4. 永远\n5. 待\n6. 顾\n\n用法说明\n拦：阻挡，不让通过；迎是迎接，送是送行。\n难怪：明白原因后，觉得某种情况并不奇怪；因为引出原因，所以引出结果。", "group": false}, {"title": "04 · 情境选词 5", "mins": 0, "tag": "情境选词", "intro": "读完整个句子或情境，选出最准确的一项。完成后检查答案。", "questions": [{"text": "她____着风往前走，风正从前面吹来。", "choices": ["迎", "顺", "背"], "correct": 0, "target": "迎"}, {"text": "____我来说，独自旅行是一次新挑战。", "choices": ["关于", "至于", "对于"], "correct": 2, "target": "对于"}, {"text": "“脸上____笑”中，哪个字能组成表示带着笑容的词？", "choices": ["藏", "含", "挂着"], "correct": 1, "target": "含"}, {"text": "“山坡上____着些小村庄”中的字，把村庄写得像静静躺着一样。", "choices": ["卧", "立", "站"], "correct": 0, "target": "卧"}, {"text": "她不仅会弹钢琴，____还能自己作曲。", "choices": ["但是", "于是", "甚至"], "correct": 2, "target": "甚至"}, {"text": "雨后，树叶____更加翠绿。", "choices": ["显示", "显现", "显得"], "correct": 2, "target": "显得"}], "answer": "1. 迎\n2. 对于\n3. 含\n4. 卧\n5. 甚至\n6. 显得", "group": false}, {"title": "05 · 句子修理站", "mins": 0, "tag": "选择修改后的句子", "intro": "找出原句用词不当的地方，选择自然、准确的修改。", "questions": [{"text": "“公园里弥漫着许多游客。”怎样修改自然？", "choices": ["公园里聚集了许多游客。", "公园里滋润了许多游客。"], "correct": 0, "target": null}, {"text": "“清澈的歌声传来。”怎样修改自然？", "choices": ["苍翠的歌声传来。", "嘹亮的歌声传来。"], "correct": 1, "target": null}, {"text": "“我们热情地完成作业。”怎样修改自然？", "choices": ["我们认真地完成作业。", "我们热闹地完成作业。"], "correct": 0, "target": null}, {"text": "“他给我留下深厚的印象。”怎样修改自然？", "choices": ["深刻的印象", "深厚的纪念"], "correct": 0, "target": null}], "answer": "①游客聚集；花香弥漫。②歌声嘹亮；河水清澈。\n③认真完成作业；热情欢迎客人。④印象深刻；友谊深厚。\n挑战：保留原来的词语，口头换一个句子。", "group": false}, {"title": "06 · 错误句子改一改", "mins": 0, "tag": "自己修改句子", "intro": "找出用得不合适的词，换成合适的词。可以口头说出完整句子，也可以在下方输入修改后的句子；无需提交。", "group": false, "questions": [{"text": "大家从四面八方集中到这里，一起散开了。"}, {"text": "春雨解决了干旱的大地。"}, {"text": "我们请客人表演了一杯奶茶。"}, {"text": "草原上的小伙子性格清澈。"}, {"text": "十几个蒙古包围成了一个相片。"}, {"text": "他奋不顾身地躺在沙发上休息。"}], "answer": "1. 大家从四面八方集中到这里，一起集合了。\n“集中到这里”应与“集合”搭配；“散开”表示分散离去。\n\n2. 春雨滋润了干旱的大地。\n雨水滋润大地；解决问题、困难。\n\n3. 我们请客人喝了一杯奶茶。\n奶茶可以喝；舞蹈可以表演。\n\n4. 草原上的小伙子性格豪放。\n“清澈”形容水；“豪放”可以形容性格。\n\n5. 十几个蒙古包围成了一个半圆。\n“半圆”表示形状；“相片”是照片。\n\n6. 他悠闲地躺在沙发上休息。\n“奋不顾身”强调不顾安危，不能形容普通休息。\n\n参考答案不唯一。修改后意思清楚、搭配自然即可。"}, {"title": "07 · 综合运用", "mins": 0, "tag": "联系上下文选择", "intro": "读完整个情境，选出最准确的一项。完成后检查答案。", "group": false, "questions": [{"text": "小明已答应借球给朋友，却临时不认账。哪个词最能描述他的行为？", "choices": ["耍赖", "干脆", "豪放"], "correct": 0}, {"text": "车子一路颠簸。哪种经历最符合这个词？", "choices": ["在平坦路面上平稳行驶", "在坑洼路面上上下摇晃", "停在路边等人"], "correct": 1}, {"text": "照片、车票都可以留作纪念。它们共同的作用是什么？", "choices": ["证明东西很贵", "帮助记住一段经历", "让旅行更快结束"], "correct": 1}, {"text": "她练习失败了很多次，仍然执着地追求目标。下列哪种做法与“执着”相反？", "choices": ["继续寻找改进办法", "坚持每天练习", "遇到一次困难就放弃"], "correct": 2}, {"text": "朋友来家里做客，我有些不自在。怎样理解“不自在”？", "choices": ["不太放松，感到拘束", "完全没有自由", "不愿意承担责任"], "correct": 0}, {"text": "“广阔”和“无垠”放在一起形容草原，分别强调什么？", "choices": ["范围大、没有边际", "草很多、花很香", "天气暖、阳光强"], "correct": 0}, {"text": "“天边飘来几朵白云”中的“几朵”与哪个词最适合搭配？", "choices": ["雷声", "云朵", "日光"], "correct": 1}, {"text": "“蒙古包、蒙古袍、蒙古马”分别属于哪一类？", "choices": ["住处、服饰、动物", "服饰、动物、住处", "动物、住处、服饰"], "correct": 0}], "answer": "1. A　耍赖\n2. B　在坑洼路面上上下摇晃\n3. B　帮助记住一段经历\n4. C　遇到一次困难就放弃\n5. A　不太放松，感到拘束\n6. A　范围大、没有边际\n7. B　云朵\n8. A　住处、服饰、动物"}];let index=0,store={};try{store=JSON.parse(localStorage.getItem('word-lab-homework-v1')||'{}')}catch(e){}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('word-lab-homework-v1',JSON.stringify(store))}catch(e){}}

const baseRender=render;render=function(){baseRender();const s=slides[index];if(!s.match)return;const grid=document.createElement('div');grid.className='matchgrid';const left=document.createElement('div'),right=document.createElement('div');left.className=right.className='matchcol';left.innerHTML='<strong>字词</strong>';right.innerHTML='<strong>解释 / 搭配</strong>';let selected=null;let pairs=store['match-v2-'+index]||{};Object.keys(pairs).forEach(k=>{if(!Number.isInteger(pairs[k])||pairs[k]<0||pairs[k]>=s.match.length)delete pairs[k]});let lb=[],rb=[];s.match.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{selected=i;paint()};left.appendChild(b);lb[i]=b});s.order.forEach(i=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+s.order.indexOf(i))+'. '+s.match[i][1];b.onclick=()=>{if(selected===null){result.textContent='先点左边的字词，再点右边的解释或搭配。';return}Object.keys(pairs).forEach(k=>{if(pairs[k]===i)delete pairs[k]});pairs[selected]=i;selected=null;store['match-v2-'+index]=pairs;save();result.textContent='';paint()};right.appendChild(b);rb[i]=b});const result=document.createElement('div');result.className='matchresult';result.setAttribute('aria-live','polite');function paint(){lb.forEach((b,i)=>{b.className=(selected===i?'picked ':'')+(pairs[i]!==undefined?'paired':'');b.textContent=(i+1)+'. '+s.match[i][0]+(pairs[i]!==undefined?' → '+String.fromCharCode(65+s.order.indexOf(pairs[i])):'')});rb.forEach((b,i)=>{b.className=Object.values(pairs).includes(i)?'paired':''})}const check=document.createElement('button');check.className='primary';check.textContent='检查配对';check.onclick=()=>{let correct=0;const wrong=[];s.match.forEach((x,i)=>{if(pairs[i]===i)correct++;else wrong.push(x[0])});result.textContent=correct===s.match.length?'✓ 全部配对正确！可以继续下一项练习。':'已配对正确 '+correct+' / '+s.match.length+'。再检查：'+wrong.join('、')+'。'};const reset=document.createElement('button');reset.textContent='重新配对';reset.onclick=()=>{pairs={};sel
